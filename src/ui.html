<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mushline</title>
<style>
  :root {
    --bg: #14151f; --surface: #1c1e29; --surface-2: #242736;
    --fg: #e6e8ef; --muted: #9aa0b4; --faint: #6f7590;
    --border: #282b3a; --border-strong: #3a3e54;
    --accent: oklch(72% 0.13 250);
    --danger: #ff7b7b; --warn: #e0c060; --ok: #7dd87d; --idle: #8e8e93;
    --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-width: 277px;
    max-width: 100%;
    overscroll-behavior: none;
    /* NOTE(O-1): 조상 전수에 overflow-x:hidden 금지. 잘림 은폐가 아니라
       셀 ellipsis + 줄바꿈으로 폭을 맞춘다. */
  }
  body {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg);
    background: var(--bg);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .banner {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    font-size: 12px;
    letter-spacing: 0.02em;
    line-height: 1.5;
    padding: 8px 12px;
    overflow-wrap: break-word;
    word-break: break-word;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  }
  .banner[hidden] { display: none; }
  #staleBanner { background: #5a1f1f; color: #ffd9d9; }
  #connBanner { background: #4a3a12; color: #ffe9a8; }
  #vBanner { background: #3a2a5a; color: #ddd0ff; }
  #layout {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    min-width: 277px;
    max-width: 100%;
  }
  #msgPane {
    flex: 1 1 55%;
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    overflow-anchor: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 0;
  }
  .msg {
    margin: 0;
    padding: 6px 8px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    min-width: 0;
  }
  .msg .meta {
    position: relative;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: #9ecfff;
    overflow-wrap: break-word;
    word-break: break-word;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .msg .meta .intent {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .msg .meta .intent::before { content: "· "; }
  .msg .text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg);
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-width: 65ch;
  }
  .msg .ts { color: var(--faint); }
  .msg.clamped .meta, .msg.expanded .meta { cursor: pointer; padding-right: 18px; }
  .msg.clamped .meta:hover, .msg.expanded .meta:hover { color: #c4dcff; }
  .msg:hover, .trow:hover { background: rgba(255,255,255,0.03); }
  .msg.expanded .text {
    display: block;
    overflow: visible;
  }
  .msg .exp {
    display: none;
    position: absolute;
    right: 0;
    top: 1px;
    color: var(--faint);
  }
  .msg .exp svg { display: block; }
  .msg.clamped .exp, .msg.expanded .exp { display: inline-flex; }
  .msg.expanded .exp svg { transform: rotate(180deg); }
  #divider {
    flex: 0 0 auto;
    height: 1px;
    background: var(--border-strong);
  }
  #topTabs {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
    min-width: 0;
    flex: 0 0 auto;
  }
  #viewToggle { display: flex; gap: 4px; min-width: 0; }
  #viewToggle button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.02em;
    font-weight: 600;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    min-height: 32px;
    min-width: 44px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #viewToggle button:hover { background: rgba(255,255,255,0.05); color: var(--fg); }
  #viewToggle button[aria-pressed="true"] {
    background: rgba(255,255,255,0.1);
    color: var(--fg);
  }
  #agentPane {
    flex: 1 1 45%;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #agentHeader {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
    min-width: 0;
  }
  #agentHeader .title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #agentHeader .count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.02em;
  }
  #agentList, #timeList {
    min-width: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  #agentList { flex: 1 1 auto; min-height: 0; }
  /* UI 배치 #3: FR-15 max-height는 인라인 스타일이 아니라 tall 클래스로만 건다. */
  #agentList.tall { max-height: 100%; }
  /* 상단 목록은 #msgPane 스크롤에 맡긴다. max-height를 두지 않는다. */
  #timeList { max-height: none; }
  /* FR-11: 이력 영역 클릭 → 모달. N 상한은 HISTORY_N이 건다. */
  .hwrap { position: relative; min-width: 0; border-radius: 4px; }
  .hwrap .hist { padding-right: 26px; }
  .hexpand {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
  }
  .hexpand svg { width: 12px; height: 12px; }
  .hexpand:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
  #histModal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    background: rgba(0,0,0,.6);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 8px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  #histModal[hidden] { display: none; }
  #histDlg {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    max-width: 100%;
    max-height: 80vh;
    max-height: 80dvh;
    overflow-y: auto;
    padding: 8px;
  }
  #histDlg .mhead {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
    padding: 4px 0 8px 0;
  }
  #histTitle {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #histDlg .mrow {
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--fg);
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  #histDlg .mrow:hover { background: rgba(255,255,255,0.03); }
  .agent {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    min-width: 0;
  }
  .agent:hover { background: rgba(255,255,255,0.03); }
  .agent.blocked {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #241f2b;
    border-left: 3px solid #e05353;
  }
  .agent .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-width: 0;
    margin-bottom: 4px;
  }
  .agent .aname {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .agent .who { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .agent .tool {
    flex: none;
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--faint);
    margin-left: 2px;
    padding: 0;
    white-space: nowrap;
  }
  .agent .tool::before {
    content: "";
    width: 1px;
    height: 10px;
    background: var(--border-strong);
    margin-right: 6px;
  }
  .agent .sglyph { flex: none; font-size: 11px; }
  .sg-active { color: var(--ok); }
  .sg-listening { color: var(--warn); }
  .sg-blocked { color: var(--danger); }
  .sg-inactive, .sg-unknown { color: var(--idle); }
  .agent .st {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .st-active { color: var(--ok); }
  .st-listening { color: var(--warn); }
  .st-blocked { color: var(--danger); }
  .st-inactive, .st-unknown { color: var(--idle); }
  .agent .desc {
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    overflow-wrap: break-word;
    word-break: break-word;
    margin-bottom: 4px;
    max-width: 65ch;
  }
  /* O-3 측정 셀. 이 셀에만 ellipsis용 overflow를 둔다. */
  .cur {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    color: var(--fg);
  }
  .hist {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  #histClose {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
  }
  #histClose:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
  #histClose svg { width: 14px; height: 14px; }
  .trow {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
  }
  .trow .tt { color: var(--faint); }
  .trow .kind {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 0 4px;
    margin-right: 4px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div id="connBanner" class="banner" hidden></div>
<div id="staleBanner" class="banner" hidden></div>
<div id="vBanner" class="banner" hidden></div>
<main id="layout">
  <header id="topTabs" aria-label="top view tabs">
    <span id="viewToggle" role="tablist" aria-label="Switch top view">
      <button id="tabLog" data-view="log" aria-pressed="true" role="tab"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h7"/></svg>Log</button><button id="tabTime" data-view="time" aria-pressed="false" role="tab"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/></svg>Timeline</button>
    </span>
  </header>
  <section id="msgPane" aria-label="top views">
    <div id="msgList"></div>
    <div id="timeList" hidden></div>
  </section>
  <div id="divider"></div>
  <section id="agentPane" aria-label="agents">
    <header id="agentHeader">
      <span class="title">Agents</span><span class="count" id="agentCount"></span>
    </header>
    <div id="agentList"></div>
  </section>
</main>
<div id="histModal" hidden>
  <div id="histDlg" role="dialog" aria-modal="true" aria-label="Full history">
    <div class="mhead"><span id="histTitle"></span><button id="histClose" aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div id="histBody"></div>
  </div>
</div>
<script>
(function () {
  "use strict";

  /* SCHEMA §3-1. 클라이언트 버전과 호환 하한. minClientV는 /version에서 갱신. */
  var CLIENT_V = 1;
  var minClientV = 1;

  /* HISTORY_N: PRD FR-11. N=3 고정, 설정·쿼리로 변경 불가. */
  var HISTORY_N = 3;
  /* UI 배치 #3: 인라인 스타일·매직넘버 금지. 값 변경은 이 상수만 고친다. */
  var HIST_DEFAULT_N = 2;         /* FR-11: 기본 노출 최신 2건 */
  var MODAL_HISTORY_MAX = 20;     /* FR-11 개정: 모달 최대 20건 */
  var AGENT_TALL_MIN_N = 5;       /* FR-15: 5명 이상일 때만 하단 스크롤 */
  var AGENT_TALL_CLASS = "tall";  /* FR-15: #agentList max-height 토글 클래스 */
  var BUFFER_MAX = 200;
  var HEARTBEAT_STALE_MS = 30000;
  /* FR-10: 상단 탭 선택 영속. 기존 하단 토글 키(mushline.view)를 재사용한다.
     값은 상단 탭에 맞게 log/time. 구 값 agents는 log로 이행한다. */
  var VIEW_KEY = "mushline.view";

  var $ = function (id) { return document.getElementById(id); };
  var msgList = $("msgList"), agentList = $("agentList"), timeList = $("timeList");
  var agentCount = $("agentCount");
  var connBanner = $("connBanner"), staleBanner = $("staleBanner"), vBanner = $("vBanner");
  var tabLogBtn = $("tabLog"), tabTimeBtn = $("tabTime");

  var state = {
    agents: [],
    activities: [],   /* 오래된 순. DOM·이력의 원본 */
    view: "log",
    healthOk: true,
    healthSource: null,
    healthReason: null,
    seenIds: new Set(),
    needClearOnSnapshot: false,
    lastHeartbeatAt: 0,
    everConnected: false,
    openedCount: 0,
    vDropped: 0,
    lastBannerText: null
  };

  try {
    var saved = window.localStorage.getItem(VIEW_KEY);
    if (saved === "log" || saved === "time") state.view = saved;
    else if (saved === "agents") state.view = "log";
  } catch (e) { /* localStorage 불가 환경에서는 기본 뷰 */ }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* SCHEMA §4 소유(W2): 당일은 HH:MM, 전일 이전은 MM-DD HH:MM. 상대시간 금지. */
  function fmtTime(iso) {
    if (iso === null || iso === undefined || iso === "") return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear() &&
      d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (sameDay) return hm;
    return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + hm;
  }

  /* SCHEMA §4 소유(W2): statusContext의 tool: 접두를 떼고
     <label> + 공백 2칸 + <detail>. 한쪽 null이면 나머지만, 둘 다 null이면 (idle). */
  function combineLine(statusContext, statusDetail) {
    var label = statusContext;
    if (typeof label === "string" && label.indexOf("tool:") === 0) {
      label = label.slice(5);
    }
    var parts = [];
    if (label !== null && label !== undefined && label !== "") parts.push(label);
    if (statusDetail !== null && statusDetail !== undefined && statusDetail !== "") parts.push(statusDetail);
    if (parts.length > 0) return parts.join("  ");
    if (statusContext === null && statusDetail === null) return "(idle)";
    return "";
  }

  function esc(text) { return text === null || text === undefined ? "" : String(text); }

  /* UI 배치2-1: 메시지 본문의 연속 공백 줄을 접는다. 공백만 있는 줄의 연속은
     최대 1줄로 줄이고 앞쪽 빈 줄은 버려 빈 줄이 자리를 차지하지 않게 한다.
     헤더·접기/펼치기 버튼은 건드리지 않는다. */
  function foldBlankLines(s) {
    var lines = String(s).split("\n");
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].trim() !== "") { out.push(lines[i]); continue; }
      var prev = out.length > 0 ? out[out.length - 1] : null;
      if (prev !== null && prev.trim() !== "") out.push("");
    }
    return out.join("\n");
  }

  function statusGlyph(status) {
    if (status === "active") return "\u25B6";    /* ▶ */
    if (status === "listening") return "\u25CF"; /* ● */
    if (status === "blocked") return "\u25A0";   /* ■ */
    if (status === "inactive") return "\u25CB";  /* ○ */
    return "?";
  }

  /* UI 배치 #5: tool 약자 매핑. claude→CC, opencode→OC, codex→CX,
     그 외 원문 앞 2자 대문자. null/""이면 뱃지 없음. 모델명은 표시하지 않는다. */
  function toolAbbr(tool) {
    if (tool === null || tool === undefined || tool === "") return null;
    var t = String(tool);
    var low = t.toLowerCase();
    if (low === "claude") return "CC";
    if (low === "opencode") return "OC";
    if (low === "codex") return "CX";
    return t.slice(0, 2).toUpperCase();
  }

  /* --- 배너 --- */

  /* SCHEMA §3-10: ok=false 배너는 ok=true까지 유지. 정상 snapshot이 와도 내리지 않는다. */
  /* SCHEMA §3-11: heartbeat 30초 공백도 stale. */
  function refreshStale() {
    var hbStale = state.lastHeartbeatAt > 0 &&
      (Date.now() - state.lastHeartbeatAt > HEARTBEAT_STALE_MS);
    var stale = !state.healthOk || hbStale;
    var text = null;
    if (!state.healthOk) {
      text = "STALE — " + esc(state.healthSource) + ": " + esc(state.healthReason);
    } else if (hbStale) {
      text = "STALE — no heartbeat for 30s";
    }
    if (text === state.lastBannerText) return;
    state.lastBannerText = text;
    if (text === null) {
      staleBanner.hidden = true;
      staleBanner.textContent = "";
    } else {
      staleBanner.textContent = text;
      staleBanner.hidden = false;
    }
  }

  function setConn(text) {
    if (text === null) {
      connBanner.hidden = true;
      connBanner.textContent = "";
    } else {
      connBanner.textContent = text;
      connBanner.hidden = false;
    }
  }

  /* SCHEMA §3-1: v가 minClientV 미만이거나 모르는 값이면 버리고 경고. 조용히 무시 금지. */
  function checkVersion(ev) {
    if (ev === null || ev === undefined || typeof ev.v !== "number") {
      state.vDropped += 1;
      vBanner.textContent = "Version warning — no v, dropped " + state.vDropped + " events";
      vBanner.hidden = false;
      return false;
    }
    if (ev.v < minClientV) {
      state.vDropped += 1;
      vBanner.textContent = "Version warning — v=" + ev.v + " < minClientV=" + minClientV +
        ", dropped " + state.vDropped + " events";
      vBanner.hidden = false;
      return false;
    }
    return true;
  }

  /* --- 렌더 --- */

  function sortedAgents() {
    var blocked = [], rest = [];
    state.agents.forEach(function (a) {
      if (a.status === "blocked") blocked.push(a);
      else rest.push(a);
    });
    return blocked.concat(rest);
  }

  function historyFor(name) {
    var out = [];
    for (var i = state.activities.length - 1; i >= 0; i--) {
      if (state.activities[i].agent === name) {
        out.push(state.activities[i]);
        if (out.length >= HISTORY_N) break;
      }
    }
    return out;
  }

  function activityLine(a) {
    return combineLine("tool:" + a.label, a.detail);
  }

  function renderAgents() {
    agentList.textContent = "";
    var list = sortedAgents();
    agentCount.textContent = list.length + " agents";
    list.forEach(function (a) {
      var wrap = document.createElement("div");
      wrap.className = "agent" + (a.status === "blocked" ? " blocked" : "");

      var head = document.createElement("div");
      head.className = "head";
      var displayName = (a.tag !== null && a.tag !== undefined && a.tag !== "")
        ? a.tag + "/" + a.name : esc(a.name);
      var who = document.createElement("span");
      who.className = "who";
      var aname = document.createElement("span");
      aname.className = "aname";
      aname.textContent = displayName + (a.unreadCount > 0 ? " (" + a.unreadCount + ")" : "");
      who.appendChild(aname);
      var abbr = toolAbbr(a.tool);
      if (abbr !== null) {
        var badge = document.createElement("span");
        badge.className = "tool";
        badge.setAttribute("data-tool", esc(a.tool));
        badge.textContent = abbr;
        badge.title = esc(a.tool);
        who.appendChild(badge);
      }
      var glyph = document.createElement("span");
      glyph.className = "sglyph sg-" + esc(a.status);
      glyph.textContent = statusGlyph(a.status);
      who.insertBefore(glyph, who.firstChild);
      head.appendChild(who);
      var st = document.createElement("span");
      st.className = "st st-" + esc(a.status);
      st.textContent = esc(a.status);
      head.appendChild(st);
      head.setAttribute("data-agent", esc(a.name));
      wrap.appendChild(head);

      /* hcom이 description에 상태값을 그대로 내려(head 상태와 중복, 예: "listening")
         오는 경우에는 그리지 않는다. 실제 설명문은 그대로 둔다. */
      var descText = esc(a.description).trim();
      if (descText !== "" && descText.toLowerCase() !== esc(a.status).trim().toLowerCase()) {
        var desc = document.createElement("div");
        desc.className = "desc";
        desc.textContent = esc(a.description);
        wrap.appendChild(desc);
      }

      var cur = document.createElement("span");
      cur.className = "cur";
      cur.setAttribute("data-oracle", "current-line");
      cur.title = combineLine(a.statusContext, a.statusDetail);
      cur.textContent = combineLine(a.statusContext, a.statusDetail);
      wrap.appendChild(cur);

      var hists = historyFor(a.name);
      if (hists.length > 0) {
        (function (nm, hs) {
          var hw = document.createElement("div");
          hw.className = "hwrap";
          hw.setAttribute("data-histwrap", esc(nm));
          var shown = Math.min(HIST_DEFAULT_N, hs.length);
          for (var hi = 0; hi < shown; hi++) {
            var hline = document.createElement("span");
            hline.className = "hist";
            hline.textContent = fmtTime(hs[hi].ts) + " " + activityLine(hs[hi]);
            hw.appendChild(hline);
          }
          var moreBtn = document.createElement("button");
          moreBtn.className = "hexpand";
          moreBtn.setAttribute("aria-label", nm + " view full history");
          moreBtn.title = nm + " view full history";
          moreBtn.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h5v5M14 2L9 7M7 14H2V9M2 14l5-5"/></svg>';
          moreBtn.addEventListener("click", function () { openHistModal(nm); });
          hw.appendChild(moreBtn);
          wrap.appendChild(hw);
        })(a.name, hists);
      }

      agentList.appendChild(wrap);
    });
    /* FR-15: 5명 이상일 때만 하단 스크롤. 4명 이하에서는 max-height를 두지 않아
       O-2①(무스크롤)을 구조적으로 보장한다. UI 배치 #3: 인라인 스타일 대신
       tall 클래스 + 상수로만 토글한다. */
    if (list.length >= AGENT_TALL_MIN_N) {
      agentList.classList.add(AGENT_TALL_CLASS);
    } else {
      agentList.classList.remove(AGENT_TALL_CLASS);
    }
  }

  function renderTime() {
    timeList.textContent = "";
    var acts = state.activities.slice().sort(function (x, y) {
      return (x.ts < y.ts ? 1 : (x.ts > y.ts ? -1 : 0));
    });
    acts.forEach(function (a) {
      var row = document.createElement("span");
      row.className = "trow";
      var kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = esc(a.kind);
      row.appendChild(kind);
      var tt = document.createElement("span");
      tt.className = "tt";
      tt.textContent = fmtTime(a.ts) + " " + a.agent + " ";
      row.appendChild(tt);
      row.appendChild(document.createTextNode(activityLine(a)));
      row.title = fmtTime(a.ts) + " " + a.agent + " " + activityLine(a);
      timeList.appendChild(row);
    });
    /* 상단 영역은 #msgPane 스크롤에 맡긴다. 하단 FR-15 max-height와 무관.
       UI 배치 #3: max-height는 CSS(#timeList{max-height:none})로만 둔다. */
  }

  /* FR-10: 상단은 로그/시간순 탭, 하단은 에이전트별 뷰 고정.
     UI 배치 #2: applyView는 렌더 1회(renderAgents)만 한다.
     timeList 렌더는 시간순 뷰일 때 renderTimeOnce가 따로 맡아
     로그탭에서 숨은 목록을 그리지 않는다. */
  function applyView() {
    var isLog = state.view === "log";
    msgList.hidden = !isLog;
    timeList.hidden = isLog;
    tabLogBtn.setAttribute("aria-pressed", isLog ? "true" : "false");
    tabTimeBtn.setAttribute("aria-pressed", isLog ? "false" : "true");
    renderAgents();
  }
  function renderTimeOnce() {
    if (state.view === "time") renderTime();
  }

  /* FR-11 개정: 모달은 최대 MODAL_HISTORY_MAX=20건. 기본 2건(historyFor)과
     별도 경로다. 보관량: 에이전트 7명×20건=140 ≤ BUFFER_MAX=200이라
     버퍼 증량 없이 전원 20건을 담는다. */
  function modalHistories(name) {
    var out = [];
    for (var i = state.activities.length - 1; i >= 0; i--) {
      if (state.activities[i].agent === name) out.push(state.activities[i]);
    }
    return out.slice(0, MODAL_HISTORY_MAX);
  }
  /* FR-11 모달: N 상한은 MODAL_HISTORY_MAX가 건다. */
  var histModal = $("histModal"), histTitle = $("histTitle"),
      histBody = $("histBody"), histClose = $("histClose");
  function openHistModal(name) {
    var hs = modalHistories(name);
    histTitle.textContent = name + " history " + hs.length + "/" + MODAL_HISTORY_MAX;
    histBody.textContent = "";
    if (hs.length === 0) {
      var p = document.createElement("div");
      p.className = "mrow";
      p.textContent = "No history";
      histBody.appendChild(p);
    }
    hs.forEach(function (h) {
      var row = document.createElement("div");
      row.className = "mrow";
      row.textContent = fmtTime(h.ts) + " " + activityLine(h);
      histBody.appendChild(row);
    });
    histModal.hidden = false;
    histClose.focus();
  }
  function closeHistModal() { histModal.hidden = true; }
  histClose.addEventListener("click", closeHistModal);
  histModal.addEventListener("click", function (ev) {
    if (ev.target === histModal) closeHistModal();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !histModal.hidden) closeHistModal();
  });

  function setView(v) {
    if (v !== "log" && v !== "time") return;
    state.view = v;
    try { window.localStorage.setItem(VIEW_KEY, v); } catch (e) { /* 무시 */ }
    applyView();
    renderTimeOnce();
  }

  tabLogBtn.addEventListener("click", function () { setView("log"); });
  tabTimeBtn.addEventListener("click", function () { setView("time"); });

  /* 메시지: 최신이 아래, 자동 스크롤(맨 아래 근처일 때만 따라감). */
  var msgPane = $("msgPane");
  var stickToBottom = true;
  msgPane.addEventListener("scroll", function () {
    stickToBottom = (msgPane.scrollHeight - msgPane.scrollTop - msgPane.clientHeight) < 24;
  });

  function appendMessage(m) {
    var wrap = document.createElement("div");
    wrap.className = "msg";
    var meta = document.createElement("div");
    meta.className = "meta";
    var to = (m.to && m.to.length) ? " → @" + m.to.join(",@") : " → (all)";
    var from = document.createTextNode("● " + m.from + to + "  ");
    meta.appendChild(from);
    if (m.intent) {
      var chip = document.createElement("span");
      chip.className = "intent";
      chip.textContent = m.intent;
      meta.appendChild(chip);
    }
    var ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = "  " + fmtTime(m.ts);
    meta.appendChild(ts);
    var exp = document.createElement("span");
    exp.className = "exp";
    exp.setAttribute("aria-hidden", "true");
    exp.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
    meta.appendChild(exp);
    var text = document.createElement("div");
    text.className = "text";
    text.textContent = foldBlankLines(esc(m.text));
    text.title = esc(m.text);
    /* 펼칠 내용이 있을 때만 아래(말줄임 판정 뒤)에서 role·핸들러를 건다. */
    wrap.appendChild(meta);
    wrap.appendChild(text);
    msgList.appendChild(wrap);
    if (text.scrollHeight > text.clientHeight + 1) {
      wrap.classList.add("clamped");
      meta.setAttribute("role", "button");
      meta.setAttribute("tabindex", "0");
      meta.setAttribute("aria-expanded", "false");
      meta.title = "Click to expand/collapse";
      meta.addEventListener("click", function () {
        var on = wrap.classList.toggle("expanded");
        meta.setAttribute("aria-expanded", on ? "true" : "false");
        if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
      });
      meta.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); meta.click(); }
      });
    }
    while (msgList.children.length > BUFFER_MAX) {
      msgList.removeChild(msgList.firstChild);
    }
    if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
  }

  /* --- 이벤트 처리 --- */

  function onSnapshot(ev) {
    if (!checkVersion(ev)) return;
    /* SCHEMA §3-4: 재연결 후 첫 snapshot에 중복 배제 윈도 파기. */
    if (state.needClearOnSnapshot) {
      state.seenIds.clear();
      state.needClearOnSnapshot = false;
    }
    /* SCHEMA §3-5: agents는 전량. 없는 에이전트는 사라진 것으로 교체한다. */
    state.agents = Array.isArray(ev.agents) ? ev.agents : [];
    applyView();
    renderTimeOnce();
    refreshStale();
  }

  function onActivity(ev) {
    if (!checkVersion(ev)) return;
    if (ev.id !== null && ev.id !== undefined) {
      if (state.seenIds.has(ev.id)) return;
      state.seenIds.add(ev.id);
      if (state.seenIds.size > 1000) {
        var first = state.seenIds.values().next().value;
        state.seenIds.delete(first);
      }
    }
    state.activities.push({
      id: ev.id, ts: ev.ts, agent: ev.agent,
      kind: ev.kind, label: ev.label, detail: ev.detail
    });
    while (state.activities.length > BUFFER_MAX) state.activities.shift();
    applyView();
    renderTimeOnce();
    refreshStale();
  }

  function onMessage(ev) {
    if (!checkVersion(ev)) return;
    if (ev.id !== null && ev.id !== undefined) {
      if (state.seenIds.has(ev.id)) return;
      state.seenIds.add(ev.id);
    }
    appendMessage(ev);
    refreshStale();
  }

  function onHealth(ev) {
    if (!checkVersion(ev)) return;
    state.healthOk = ev.ok === true;
    state.healthSource = ev.source !== undefined ? ev.source : null;
    state.healthReason = ev.reason !== undefined ? ev.reason : null;
    refreshStale();
  }

  function onHeartbeat(ev) {
    if (!checkVersion(ev)) return;
    state.lastHeartbeatAt = Date.now();
    refreshStale();
  }

  /* --- heartbeat 감시 (SCHEMA §3-11) ---
     setInterval 금지. paint(rAF)·visibilitychange 시점의 Date.now() 차분으로만 감시한다. */
  function tick() {
    refreshStale();
    window.requestAnimationFrame(tick);
  }
  document.addEventListener("visibilitychange", function () {
    refreshStale();
  });

  /* --- 기동 --- */

  function boot() {
    var params = new URLSearchParams(window.location.search);
    var fixturePath = params.get("fixture");
    var forceSample = params.get("sample") === "1";

    fetch("/version")
      .then(function (res) { return res.json(); })
      .then(function (v) {
        if (v && typeof v.minClientV === "number") minClientV = v.minClientV;
      })
      .catch(function () { /* 버전 조회 실패는 오프라인 폴백에서 처리 */ })
      .then(function () {
        if (forceSample) {
          loadSample("Sample mode (?sample=1)");
          return;
        }
        if (fixturePath) {
          loadFixture(fixturePath);
          return;
        }
        if (typeof window.EventSource === "undefined") {
          loadSample("No EventSource — showing sample");
          return;
        }
        connect();
      });

    window.requestAnimationFrame(tick);
    applyView();
  }

  function connect() {
    var es;
    try {
      es = new window.EventSource("/events");
    } catch (e) {
      loadSample("Connection failed — showing sample");
      return;
    }
    var gotSnapshot = false;
    var failTimer = null;

    es.onopen = function () {
      state.openedCount += 1;
      /* 재연결이면 다음 snapshot이 중복 윈도 파기의 신호다 (§3-4). */
      if (state.openedCount > 1) state.needClearOnSnapshot = true;
      state.lastHeartbeatAt = Date.now();
      state.everConnected = true;
      setConn(null);
      refreshStale();
    };
    es.addEventListener("snapshot", function (e) {
      gotSnapshot = true;
      try { onSnapshot(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("activity", function (e) {
      try { onActivity(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("message", function (e) {
      try { onMessage(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("health", function (e) {
      try { onHealth(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("heartbeat", function (e) {
      try { onHeartbeat(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.onerror = function () {
      /* EventSource는 자동 재시도한다. 첫 snapshot 전 실패면 예시로 기립한다
         (SCHEMA §5: 실서버 없이 화면이 떠야 한다). */
      if (!gotSnapshot && !state.everConnected) {
        loadSample("No server — showing sample (OFFLINE)");
      } else {
        setConn("Disconnected — reconnecting…");
      }
    };
    /* failTimer를 쓰지 않는다: setTimeout도 백그라운드 스로틀 대상이며,
       예시 폴백은 onerror 경로 하나로만 처리한다. */
    void failTimer;
  }

  /* SCHEMA §1 예시 페이로드 기반 내장 샘플.
     실서버 없이 화면이 서는 것이 W1·W2 동시 진행의 전제다 (§5). */
  function sampleEvents() {
    var now = new Date();
    var iso = now.toISOString();
    var old = new Date(now.getTime() - 26 * 3600 * 1000).toISOString();
    return {
      snapshot: {
        v: 1, ts: iso,
        agents: [
          { name: "lune", tag: "w1", status: "active", statusContext: "tool:Bash",
            statusDetail: "bun run src/server.ts", description: "Server/SSE",
            directory: "/Users/x/mushline", unreadCount: 0, lastEventAt: iso },
          { name: "nova", tag: null, status: "blocked", statusContext: "approval",
            statusDetail: "Bash", description: "Frontend rendering",
            directory: "/Users/x/mushline", unreadCount: 0, lastEventAt: iso },
          { name: "sona", tag: null, status: "listening", statusContext: null,
            statusDetail: null, description: "Docs",
            directory: "/Users/x/mushline", unreadCount: 0, lastEventAt: old }
        ]
      },
      activities: [
        { v: 1, id: "sample-1", ts: iso, agent: "lune",
          kind: "tool", label: "Edit", detail: "src/server.ts" },
        { v: 1, id: "sample-2", ts: iso, agent: "nova",
          kind: "cmd", label: "Bash", detail: "bun test --watch" }
      ],
      messages: [
        { v: 1, id: "sample-m1", ts: iso, from: "lune", to: ["nova"],
          intent: "request", thread: null, text: "Boundary schema v1 pushed" },
        { v: 1, id: "sample-m2", ts: iso, from: "nova", to: ["lune"],
          intent: "ack", thread: null, text: "Got it. Wiring up render" }
      ]
    };
  }

  function loadSample(label) {
    var s = sampleEvents();
    setConn(label);
    onSnapshot(s.snapshot);
    s.activities.forEach(onActivity);
    s.messages.forEach(onMessage);
  }

  /* W1의 fixtures/oracle-set.json 갈아끼우기 경로. 형태가 다르면 경고를 낸다. */
  function loadFixture(path) {
    fetch(path)
      .then(function (res) { return res.json(); })
      .then(function (f) {
        setConn("fixture: " + path);
        var snap = f.snapshot || f;
        if (snap && Array.isArray(snap.agents)) onSnapshot(snap);
        var acts = f.activities || f.activity || [];
        acts.forEach(onActivity);
        var msgs = f.messages || f.message || [];
        msgs.forEach(onMessage);
      })
      .catch(function () {
        loadSample("Fixture failed — showing sample (OFFLINE)");
      });
  }

  boot();
})();
</script>
</body>
</html>
