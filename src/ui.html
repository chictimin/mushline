<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mushline</title>
<style>
  :root {
    --bg: #14151f; --surface: #1c1e29; --surface-2: #242736;
    --fg: #e6e8ef; --muted: #9aa0b4; --faint: #6f7590;
    --border: #282b3a; --border-strong: #3a3e54;
    --accent: oklch(72% 0.13 250);
    --danger: #ff7b7b; --warn: #e0c060; --ok: #7dd87d; --idle: #8e8e93;
    --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-width: 277px;
    max-width: 100%;
    overscroll-behavior: none;
    /* NOTE(O-1): 조상 전수에 overflow-x:hidden 금지. 잘림 은폐가 아니라
       셀 ellipsis + 줄바꿈으로 폭을 맞춘다. */
  }
  body {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg);
    background: var(--bg);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .banner {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    font-size: 12px;
    letter-spacing: 0.02em;
    line-height: 1.5;
    padding: 8px 12px;
    overflow-wrap: break-word;
    word-break: break-word;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  }
  .banner[hidden] { display: none; }
  #staleBanner { background: #5a1f1f; color: #ffd9d9; }
  #connBanner { background: #4a3a12; color: #ffe9a8; }
  #vBanner { background: #3a2a5a; color: #ddd0ff; }
  #layout {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    min-width: 277px;
    max-width: 100%;
  }
  #msgPane {
    flex: 1 1 55%;
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    overflow-anchor: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 0;
  }
  .msg {
    margin: 0;
    padding: 6px 8px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    min-width: 0;
  }
  .msg .meta {
    position: relative;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: #9ecfff;
    overflow-wrap: break-word;
    word-break: break-word;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .msg .meta .intent {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .msg .meta .intent::before { content: "· "; }
  .msg .text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg);
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-width: 65ch;
  }
  .msg .ts { color: var(--faint); }
  .msg.clamped .meta, .msg.expanded .meta { cursor: pointer; padding-right: 18px; }
  .msg.clamped .meta:hover, .msg.expanded .meta:hover { color: #c4dcff; }
  .msg:hover, .trow:hover { background: rgba(255,255,255,0.03); }
  .msg.expanded .text {
    display: block;
    overflow: visible;
  }
  .msg .exp {
    display: none;
    position: absolute;
    right: 0;
    top: 1px;
    color: var(--faint);
  }
  .msg .exp svg { display: block; }
  .msg.clamped .exp, .msg.expanded .exp { display: inline-flex; }
  .msg.expanded .exp svg { transform: rotate(180deg); }
  #divider {
    flex: 0 0 auto;
    height: 1px;
    background: var(--border-strong);
  }
  #topTabs {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
    min-width: 0;
    flex: 0 0 auto;
  }
  #viewToggle { display: flex; gap: 4px; min-width: 0; }
  #agentHeader .hleft { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #agentHeader .title, #agentHeader .count { flex: none; }
  #wsFilter {
    flex: 1 1 auto;
    min-width: 48px;
    max-width: 100%;
    min-height: 24px;
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 2px 4px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
  }
  #wsFilter:hover { color: var(--fg); }
  .msg[hidden] { display: none; }
  #viewToggle button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.02em;
    font-weight: 600;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    min-height: 32px;
    min-width: 44px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #viewToggle button:hover { background: rgba(255,255,255,0.05); color: var(--fg); }
  #viewToggle button[aria-pressed="true"] {
    background: rgba(255,255,255,0.1);
    color: var(--fg);
  }
  #agentPane {
    flex: 1 1 45%;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #agentHeader {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
    min-width: 0;
  }
  #agentHeader .title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #agentHeader .count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.02em;
  }
  #agentList, #timeList {
    min-width: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  #agentList { flex: 1 1 auto; min-height: 0; }
  /* UI 배치 #3: FR-15 max-height는 인라인 스타일이 아니라 tall 클래스로만 건다. */
  #agentList.tall { max-height: 100%; }
  /* 상단 목록은 #msgPane 스크롤에 맡긴다. max-height를 두지 않는다. */
  #timeList { max-height: none; }
  /* FR-11: 이력 영역 클릭 → 모달. N 상한은 HISTORY_N이 건다. */
  .hwrap { position: relative; min-width: 0; border-radius: 4px; }
  .hwrap .hist { padding-right: 26px; }
  .hexpand {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
  }
  .hexpand svg { width: 12px; height: 12px; }
  .hexpand:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
  #histModal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    background: rgba(0,0,0,.6);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 8px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  #histModal[hidden] { display: none; }
  #histDlg {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    max-width: 100%;
    max-height: 80vh;
    max-height: 80dvh;
    overflow-y: auto;
    padding: 8px;
  }
  #histDlg .mhead {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
    padding: 4px 0 8px 0;
  }
  #histTitle {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #histDlg .mrow {
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--fg);
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  #histDlg .mrow:hover { background: rgba(255,255,255,0.03); }
  .agent {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    min-width: 0;
  }
  .agent:hover { background: rgba(255,255,255,0.03); }
  .agent.blocked {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #241f2b;
    border-left: 3px solid #e05353;
  }
  /* M5: 섹션 모드에서 blocked 카드 sticky 해제. stuck 카드가 섹션 소속을
     시각적으로 배반하므로 static으로 되돌린다. 단일 모드는 기존 그대로. */
  #agentList.sections .agent.blocked { position: static; }
  /* M5 rev2: 그룹 헤더 띠. 리스트 전폭, 카드 head 한 줄 수준 높이,
     왼쪽 3px 그룹 색 실선(색은 인라인), 위쪽 구분선.
     텍스트는 기존 muted 토큰 유지. 내부는 셰브론 + 라벨(말줄임) +
     요약 아이콘(줄어들지 않음). 전부 textContent. */
  #agentList .agroup {
    display: flex;
    align-items: center;
    gap: 6px;
    box-sizing: border-box;
    width: 100%;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    min-width: 0;
    padding: 5px 8px;
    border-top: 1px solid var(--border);
    border-left-width: 3px;
    border-left-style: solid;
    cursor: default;
  }
  #agentList .agroup[role="button"] { cursor: pointer; }
  #agentList .agroup .agchev { flex: none; }
  #agentList .agroup .aglabel {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #agentList .agroup .agsum { flex: none; font-size: 11px; letter-spacing: 0; }
  /* M5 rev3 R6'/R15': blocked 선두 카드 head 안 상태 표시 바로 앞 그룹 라벨. muted 11px,
     min-width:0 + ellipsis. head가 좁아지면 이름보다 먼저 줄어든다
     (hact는 flex:none이라 상태·핀은 줄지 않는다). */
  .agent .wslabel {
    flex: 0 1 auto;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .agent .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-width: 0;
    margin-bottom: 4px;
  }
  .agent .aname {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* M4: 클릭 가능 이름은 포커스 대상으로 보인다. 실태그 button 금지(277px 폭 회귀 방지). */
  .agent .aname[role="button"] { cursor: pointer; }
  /* M4: cmux 밖 에이전트 이름은 비활성 표시. */
  .agent .aname.nofocus { opacity: 0.45; }
  /* M4: 포커스 실패 reason 표시. 277px 폭을 넘지 않게 말줄임. */
  .agent .focus-err {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    color: var(--danger);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .agent .who { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .agent .tool {
    flex: none;
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--faint);
    margin-left: 2px;
    padding: 0;
    white-space: nowrap;
  }
  .agent .tool::before {
    content: "";
    width: 1px;
    height: 10px;
    background: var(--border-strong);
    margin-right: 6px;
  }
  .agent .sglyph { flex: none; font-size: 11px; }
  .sg-active { color: var(--ok); }
  .sg-listening { color: var(--warn); }
  .sg-blocked { color: var(--danger); }
  .sg-inactive, .sg-unknown { color: var(--idle); }
  .agent .st {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .st-active { color: var(--ok); }
  .st-listening { color: var(--warn); }
  .st-blocked { color: var(--danger); }
  .st-inactive, .st-unknown { color: var(--idle); }
  .agent .dir {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .agent .desc {
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    overflow-wrap: break-word;
    word-break: break-word;
    margin-bottom: 4px;
    max-width: 65ch;
  }
  /* O-3 측정 셀. 이 셀에만 ellipsis용 overflow를 둔다. */
  .cur {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    color: var(--fg);
  }
  .hist {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  #histClose {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
  }
  #histClose:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
  #histClose svg { width: 14px; height: 14px; }
  .trow {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
  }
  .trow .tt { color: var(--faint); }
  .trow .kind {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 0 4px;
    margin-right: 4px;
    color: var(--muted);
  }
  /* M3-ui3: 헤더는 277px에서 1줄 유지. 설정 버튼 1개만 두어 줄바꿈하지 않는다. */
  #agentHeader { flex-wrap: nowrap; }
  #agentHeader .hleft {
    flex: 1 1 auto;
    overflow: hidden;
  }
  /* M3-ui3: 설정 버튼 래퍼. 헤더 오른쪽 끝 고정 + 버블 위치 기준. */
  #agentHeader .hsetwrap {
    position: relative;
    flex: none;
    margin-left: auto;
  }
  #agentSettings {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
  }
  #agentSettings:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
  #agentSettings[aria-expanded="true"] { color: var(--fg); background: rgba(255,255,255,0.1); }
  #agentSettings svg { width: 16px; height: 16px; display: block; }
  /* M3-ui3: 설정 버블. 버튼 아래 오른쪽 정렬, 리스트 위에 겹침.
     z-index 5 = sticky blocked 카드(1) 위, 이력 모달(10) 아래. */
  #agentSettingsPop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 150px;
    max-width: 200px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  #agentSettingsPop[hidden] { display: none; }
  #agentSettingsPop .hbtn {
    display: flex;
    width: 100%;
    text-align: left;
    justify-content: flex-start;
    align-items: center;
    gap: 6px;
  }
  /* M3-D1: 버블 안 토글 켜짐 식별. 색만이 아닌 체크+굵기로 구분.
     ::before 빈칸(꺼짐/비토글) vs ✓(켜짐). Clear pins는 토글이 아니라 항상 빈칸. */
  #agentSettingsPop .hbtn::before {
    content: "";
    flex: none;
    width: 12px;
    text-align: center;
    font-size: 11px;
    line-height: 1;
  }
  #agentSettingsPop #sortToggle[aria-pressed="true"]::before,
  #agentSettingsPop #compactToggle[aria-pressed="true"]::before {
    content: "✓";
  }
  #agentSettingsPop .hbtn[aria-pressed="true"] {
    color: var(--fg);
    background: rgba(255,255,255,0.1);
    font-weight: 700;
  }
  .hbtn {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 2px 6px;
    min-height: 24px;
    cursor: pointer;
    white-space: nowrap;
  }
  .hbtn:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
  .hbtn[aria-pressed="true"] { color: var(--fg); background: rgba(255,255,255,0.1); }
  .hbtn[hidden] { display: none; }
  /* M3: 카드 head 우측 묶음(상태 + 핀). */
  .agent .hact {
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .agent .pinbtn {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
    font-size: 12px;
    line-height: 1;
  }
  .agent .pinbtn:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
  .agent .pinbtn[aria-pressed="true"] { color: var(--warn); }
  /* M3-ui2: 핀 압정 SVG 크기. width/height 속성과 동일. */
  .agent .pinbtn svg { width: 12px; height: 12px; display: block; }
  /* M3 간략 보기: dir·desc·hwrap 숨김, cur는 기존 1줄 말줄임 그대로. */
  body.compact .agent .dir,
  body.compact .agent .desc,
  body.compact .agent .hwrap { display: none; }
  /* M3 핀 강조: Log 탭 이름 span. */
  .msg .meta [data-who].pinned { color: var(--warn); font-weight: 700; }
</style>
</head>
<body>
<div id="connBanner" class="banner" hidden></div>
<div id="staleBanner" class="banner" hidden></div>
<div id="vBanner" class="banner" hidden></div>
<main id="layout">
  <header id="topTabs" aria-label="top view tabs">
    <span id="viewToggle" role="tablist" aria-label="Switch top view">
      <button id="tabLog" data-view="log" aria-pressed="true" role="tab"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h7"/></svg>Log</button><button id="tabTime" data-view="time" aria-pressed="false" role="tab"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/></svg>Timeline</button>
    </span>
  </header>
  <section id="msgPane" aria-label="top views">
    <div id="msgList"></div>
    <div id="timeList" hidden></div>
  </section>
  <div id="divider"></div>
  <section id="agentPane" aria-label="agents">
    <header id="agentHeader">
      <span class="hleft"><span class="title">Agents</span><span class="count" id="agentCount"></span><select id="wsFilter" aria-label="Filter by workspace group" title="Filter by workspace group"><option value="all">All</option></select></span><span class="hsetwrap"><button id="agentSettings" aria-label="Agent list settings" aria-haspopup="true" aria-expanded="false" title="Agent list settings"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path fill-rule="evenodd" d="M7.03 4.12 L7.08 2.17 L8.92 2.17 L8.97 4.12 L10.06 4.57 L11.47 3.23 L12.77 4.53 L11.43 5.94 L11.88 7.03 L13.83 7.08 L13.83 8.92 L11.88 8.97 L11.43 10.06 L12.77 11.47 L11.47 12.77 L10.06 11.43 L8.97 11.88 L8.92 13.83 L7.08 13.83 L7.03 11.88 L5.94 11.43 L4.53 12.77 L3.23 11.47 L4.57 10.06 L4.12 8.97 L2.17 8.92 L2.17 7.08 L4.12 7.03 L4.57 5.94 L3.23 4.53 L4.53 3.23 L5.94 4.57 Z M6 8 A2 2 0 1 0 10 8 A2 2 0 1 0 6 8 Z"/></svg></button><div id="agentSettingsPop" hidden aria-label="Agent list settings"><button id="sortToggle" class="hbtn" aria-pressed="true" title="Toggle activity sort">Sort</button><button id="compactToggle" class="hbtn" aria-pressed="false" title="Toggle compact view">Compact</button><button id="clearPins" class="hbtn" hidden title="Clear all pins">Clear pins</button></div></span>
    </header>
    <div id="agentList"></div>
  </section>
</main>
<div id="histModal" hidden>
  <div id="histDlg" role="dialog" aria-modal="true" aria-label="Full history">
    <div class="mhead"><span id="histTitle"></span><button id="histClose" aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div id="histBody"></div>
  </div>
</div>
<script>
(function () {
  "use strict";

  /* SCHEMA §3-1. 클라이언트 버전과 호환 하한. minClientV는 /version에서 갱신. */
  var CLIENT_V = 1;
  var minClientV = 1;

  /* HISTORY_N: PRD FR-11. N=3 고정, 설정·쿼리로 변경 불가. */
  var HISTORY_N = 3;
  /* UI 배치 #3: 인라인 스타일·매직넘버 금지. 값 변경은 이 상수만 고친다. */
  var HIST_DEFAULT_N = 2;         /* FR-11: 기본 노출 최신 2건 */
  var MODAL_HISTORY_MAX = 20;     /* FR-11 개정: 모달 최대 20건 */
  var AGENT_TALL_MIN_N = 5;       /* FR-15: 5명 이상일 때만 하단 스크롤 */
  var AGENT_TALL_CLASS = "tall";  /* FR-15: #agentList max-height 토글 클래스 */
  var BUFFER_MAX = 200;
  var HEARTBEAT_STALE_MS = 30000;
  /* FR-10: 상단 탭 선택 영속. 기존 하단 토글 키(mushline.view)를 재사용한다.
     값은 상단 탭에 맞게 log/time. 구 값 agents는 log로 이행한다. */
  var VIEW_KEY = "mushline.view";
  /* 워크스페이스 필터 선택 영속. 값은 서버 Agent.workspace 키 또는 all. */
  var WS_KEY = "mushline.ws";
  var WS_ALL = "all";
  /* M3: 활동순 정렬 토글 영속. "0"이면 OFF, 그 외(미설정 포함) ON. */
  var SORT_KEY = "mushline.sort";
  /* M3: 간략 보기 토글 영속. "1"이면 ON, 그 외(미설정 포함) OFF. */
  var COMPACT_KEY = "mushline.compact";
  /* M3: 핀 영속. 이름 문자열 JSON 배열. 깨지면 빈 집합. */
  var PINS_KEY = "mushline.pins";
  /* M5 rev2: 접기 상태 영속. 섹션 키 문자열 JSON 배열. 미분류(null)는 ""로 적는다.
     Attention은 접히지 않아 저장하지 않는다. 깨지면 빈 집합. */
  var COLLAPSED_KEY = "mushline.collapsed";
  /* M4: 이름 클릭 포커스. Abort 상한 15초, 실패 표시 2.5초. */
  var FOCUS_TIMEOUT_MS = 15000;
  var FOCUS_ERR_MS = 2500;

  var $ = function (id) { return document.getElementById(id); };
  var msgList = $("msgList"), agentList = $("agentList"), timeList = $("timeList");
  var agentCount = $("agentCount");
  var connBanner = $("connBanner"), staleBanner = $("staleBanner"), vBanner = $("vBanner");
  var tabLogBtn = $("tabLog"), tabTimeBtn = $("tabTime");
  var wsFilter = $("wsFilter");
  var sortToggle = $("sortToggle"), compactToggle = $("compactToggle"), clearPins = $("clearPins");
  var agentSettings = $("agentSettings"), agentSettingsPop = $("agentSettingsPop");

  var state = {
    agents: [],
    activities: [],   /* 오래된 순. DOM·이력의 원본 */
    view: "log",
    healthOk: true,
    healthSource: null,
    healthReason: null,
    seenIds: new Set(),
    needClearOnSnapshot: false,
    lastHeartbeatAt: 0,
    everConnected: false,
    openedCount: 0,
    vDropped: 0,
    lastBannerText: null,
    ws: WS_ALL,
    /* 에이전트 이름 → workspace 키. snapshot에서 사라져도 지우지 않는다:
       끝난 에이전트의 로그도 이 세션 동안은 같은 워크스페이스로 분류된다. */
    wsOf: new Map(),
    /* workspace 키 → 마지막으로 본 라벨. */
    wsLabel: new Map(),
    /* M3: 이름별 카드 DOM 노드 재사용표. 전체 재생성 대신 갱신·재배치한다. */
    cardOf: new Map(),
    /* M3: true면 renderAgents가 카드 DOM을 만진다. 메시지 추가만으로는 서지 않는다. */
    agentsDirty: true,
    /* M3: 활동순 정렬 ON이 기본. */
    sortOn: true,
    /* M3: 간략 보기 OFF가 기본. */
    compact: false,
    /* M3: 핀한 이름 집합(프로토타입 오염 방지용 null-prototype). */
    pins: Object.create(null),
    /* M5 rev2: 접힌 섹션 키 집합(저장용 문자열 → true. 미분류는 ""). */
    collapsed: Object.create(null),
    /* M3: pointer/focus 독립 추적. holdOrder = pointerInside || focusInside. */
    pointerInside: false,
    focusInside: false,
    holdOrder: false,
    /* M3: 보류 중에 건너뛴 재정렬이 있으면 해제 시 1회 한다. */
    orderPending: false,
    /* M5 rev2: renderAgents 재진입 가드. 아래 R20 주석 참조. */
    rendering: false
  };

  /* M3: storage 읽기는 전부 삼킨다. 파싱 실패·비배열·비문자열 원소는 무시. */
  function loadPins() {
    try {
      var raw = window.localStorage.getItem(PINS_KEY);
      if (!raw) return Object.create(null);
      var v = JSON.parse(raw);
      if (!Array.isArray(v)) return Object.create(null);
      var o = Object.create(null);
      for (var i = 0; i < v.length; i++) if (typeof v[i] === "string") o[v[i]] = true;
      return o;
    } catch (e) { return Object.create(null); }
  }
  function savePins() {
    try { window.localStorage.setItem(PINS_KEY, JSON.stringify(Object.keys(state.pins))); }
    catch (e) { /* 무시 */ }
  }
  /* M5 rev2: 접기 상태 읽기·쓰기. M3 pins와 같은 방어(파싱 실패·비배열 무시,
     비문자열 원소 무시, storage 예외 삼킴, null-prototype). */
  function loadCollapsed() {
    try {
      var raw = window.localStorage.getItem(COLLAPSED_KEY);
      if (!raw) return Object.create(null);
      var v = JSON.parse(raw);
      if (!Array.isArray(v)) return Object.create(null);
      var o = Object.create(null);
      for (var i = 0; i < v.length; i++) if (typeof v[i] === "string") o[v[i]] = true;
      return o;
    } catch (e) { return Object.create(null); }
  }
  function saveCollapsed() {
    try { window.localStorage.setItem(COLLAPSED_KEY, JSON.stringify(Object.keys(state.collapsed))); }
    catch (e) { /* 무시 */ }
  }

  try {
    var saved = window.localStorage.getItem(VIEW_KEY);
    if (saved === "log" || saved === "time") state.view = saved;
    else if (saved === "agents") state.view = "log";
    var savedWs = window.localStorage.getItem(WS_KEY);
    if (typeof savedWs === "string" && savedWs !== "") state.ws = savedWs;
    if (window.localStorage.getItem(SORT_KEY) === "0") state.sortOn = false;
    if (window.localStorage.getItem(COMPACT_KEY) === "1") state.compact = true;
    state.pins = loadPins();
    state.collapsed = loadCollapsed();
  } catch (e) { /* localStorage 불가 환경에서는 기본 뷰·기본 토글·빈 핀 */ }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* SCHEMA §4 소유(W2): 당일은 HH:MM, 전일 이전은 MM-DD HH:MM. 상대시간 금지. */
  function fmtTime(iso) {
    if (iso === null || iso === undefined || iso === "") return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear() &&
      d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (sameDay) return hm;
    return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + hm;
  }

  /* SCHEMA §4 소유(W2): statusContext의 tool: 접두를 떼고
     <label> + 공백 2칸 + <detail>. 한쪽 null이면 나머지만, 둘 다 null이면 (idle). */
  function combineLine(statusContext, statusDetail) {
    var label = statusContext;
    if (typeof label === "string" && label.indexOf("tool:") === 0) {
      label = label.slice(5);
    }
    var parts = [];
    if (label !== null && label !== undefined && label !== "") parts.push(label);
    if (statusDetail !== null && statusDetail !== undefined && statusDetail !== "") parts.push(statusDetail);
    if (parts.length > 0) return parts.join("  ");
    if (statusContext === null && statusDetail === null) return "(idle)";
    return "";
  }

  function esc(text) { return text === null || text === undefined ? "" : String(text); }

  /* UI 배치2-1: 메시지 본문의 연속 공백 줄을 접는다. 공백만 있는 줄의 연속은
     최대 1줄로 줄이고 앞쪽 빈 줄은 버려 빈 줄이 자리를 차지하지 않게 한다.
     헤더·접기/펼치기 버튼은 건드리지 않는다. */
  function foldBlankLines(s) {
    var lines = String(s).split("\n");
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].trim() !== "") { out.push(lines[i]); continue; }
      var prev = out.length > 0 ? out[out.length - 1] : null;
      if (prev !== null && prev.trim() !== "") out.push("");
    }
    return out.join("\n");
  }

  function statusGlyph(status) {
    if (status === "active") return "\u25B6";    /* ▶ */
    if (status === "listening") return "\u25CF"; /* ● */
    if (status === "blocked") return "\u25A0";   /* ■ */
    if (status === "inactive") return "\u25CB";  /* ○ */
    return "?";
  }

  /* UI 배치 #5: tool 약자 매핑. claude→CC, opencode→OC, codex→CX,
     그 외 원문 앞 2자 대문자. null/""이면 뱃지 없음. 모델명은 표시하지 않는다. */
  function toolAbbr(tool) {
    if (tool === null || tool === undefined || tool === "") return null;
    var t = String(tool);
    var low = t.toLowerCase();
    if (low === "claude") return "CC";
    if (low === "opencode") return "OC";
    if (low === "codex") return "CX";
    return t.slice(0, 2).toUpperCase();
  }

  /* --- 배너 --- */

  /* SCHEMA §3-10: ok=false 배너는 ok=true까지 유지. 정상 snapshot이 와도 내리지 않는다. */
  /* SCHEMA §3-11: heartbeat 30초 공백도 stale. */
  function refreshStale() {
    var hbStale = state.lastHeartbeatAt > 0 &&
      (Date.now() - state.lastHeartbeatAt > HEARTBEAT_STALE_MS);
    var stale = !state.healthOk || hbStale;
    var text = null;
    if (!state.healthOk) {
      text = "STALE — " + esc(state.healthSource) + ": " + esc(state.healthReason);
    } else if (hbStale) {
      text = "STALE — no heartbeat for 30s";
    }
    if (text === state.lastBannerText) return;
    state.lastBannerText = text;
    if (text === null) {
      staleBanner.hidden = true;
      staleBanner.textContent = "";
    } else {
      staleBanner.textContent = text;
      staleBanner.hidden = false;
    }
  }

  function setConn(text) {
    if (text === null) {
      connBanner.hidden = true;
      connBanner.textContent = "";
    } else {
      connBanner.textContent = text;
      connBanner.hidden = false;
    }
  }

  /* SCHEMA §3-1: v가 minClientV 미만이거나 모르는 값이면 버리고 경고. 조용히 무시 금지. */
  function checkVersion(ev) {
    if (ev === null || ev === undefined || typeof ev.v !== "number") {
      state.vDropped += 1;
      vBanner.textContent = "Version warning — no v, dropped " + state.vDropped + " events";
      vBanner.hidden = false;
      return false;
    }
    if (ev.v < minClientV) {
      state.vDropped += 1;
      vBanner.textContent = "Version warning — v=" + ev.v + " < minClientV=" + minClientV +
        ", dropped " + state.vDropped + " events";
      vBanner.hidden = false;
      return false;
    }
    return true;
  }

  /* --- 렌더 --- */

  /* --- 워크스페이스 필터 ---
     미분류(workspace를 모르는 에이전트)는 All에서만 보인다. */
  function inWs(name) {
    if (state.ws === WS_ALL) return true;
    return state.wsOf.get(name) === state.ws;
  }
  /* 보낸 쪽·받는 쪽 중 하나라도 선택 워크스페이스면 보인다. 수신자 없는 브로드캐스트는
     전원에게 배달되므로 어느 워크스페이스에서나 보인다. */
  function msgVisible(m) {
    if (state.ws === WS_ALL) return true;
    if (inWs(m.from)) return true;
    if (!m.to || m.to.length === 0) return true;
    for (var i = 0; i < m.to.length; i++) if (inWs(m.to[i])) return true;
    return false;
  }

  /* M5: 그룹 표시 라벨. 필터 옵션 라벨(ui.html renderWsOptions)과 같은 규칙.
     wsLabel이 있으면 쓰고, 없으면 dir: 접두 제거 경로, 그것도 아니면 키. */
  function wsDisplayLabel(key) {
    var lbl = state.wsLabel.get(key);
    if (lbl) return lbl;
    if (key.indexOf("dir:") === 0) return key.slice(4);
    return key;
  }
  /* M5: 표시 라벨 대소문자 무시 오름차순, 동률은 키 오름차순.
     다른 키가 같은 라벨이면 별도 섹션. null(미분류)은 맨 끝. */
  function cmpGroupKey(x, y) {
    if (x === null && y === null) return 0;
    if (x === null) return 1;
    if (y === null) return -1;
    var lx = wsDisplayLabel(x).toLowerCase(), ly = wsDisplayLabel(y).toLowerCase();
    if (lx < ly) return -1;
    if (lx > ly) return 1;
    return x < y ? -1 : (x > y ? 1 : 0);
  }
  /* M5: Sort ON 섹션 안 순서. 단일 리스트 모드의 ON 규칙과 같다. */
  function sortMembers(members) {
    members.sort(function (a, b) {
      var r = agentRank(a) - agentRank(b);
      if (r !== 0) return r;
      var t = cmpLastEventDesc(a.lastEventAt, b.lastEventAt);
      if (t !== 0) return t;
      return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
    });
    return members;
  }
  /* M5: 섹션 키 = Agent.workspace 키. null/undefined/""는 미분류(null). */
  function groupKeyOf(a) {
    if (a.workspace === null || a.workspace === undefined || a.workspace === "") return null;
    return a.workspace;
  }
  /* M5 rev3 R2' + R15': blocked는 헤더 없는 선두 행. pinned는 자기 그룹 섹션에 남는다. */
  function isAttention(a) {
    return a.status === "blocked";
  }
  /* M5 rev2 R14: 그룹 팔레트. 빨강 계열(blocked/에러와 혼동) 제외 10색, 바(실선) 색.
     배경은 바 색 12% + 다크 베이스(#1c1e26) 88% 혼합 불투명 틴트 —
     하네스가 알파를 무시하고 원시 RGB로 대비를 재므로 rgba가 아닌
     혼합 후 rgb()를 그대로 쓴다. */
  var GROUP_PALETTE = ["#4c9aff", "#4dd0e1", "#5eead4", "#3ddc97", "#7bd88a",
    "#b8e05c", "#ffd54d", "#d3a6ff", "#9d8cff", "#7cc4ff"];
  var GROUP_BASE = [28, 30, 38];
  var GROUP_TINT_Q = 0.12;
  var UNGROUPED_BAR = "#8a8a8a";
  var UNGROUPED_BG = "rgb(35, 37, 44)";
  /* M5 rev2 R14: 섹션 키의 결정적 해시(djb2) → 팔레트 인덱스.
     리로드·재정렬과 무관하게 같은 키는 같은 색. */
  function groupColorIdx(key) {
    var s = String(key === null || key === undefined ? "" : key);
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0) % GROUP_PALETTE.length;
  }
  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16)];
  }
  function groupBg(barHex) {
    var c = hexRgb(barHex);
    var r = Math.round(GROUP_BASE[0] + (c[0] - GROUP_BASE[0]) * GROUP_TINT_Q);
    var g = Math.round(GROUP_BASE[1] + (c[1] - GROUP_BASE[1]) * GROUP_TINT_Q);
    var b = Math.round(GROUP_BASE[2] + (c[2] - GROUP_BASE[2]) * GROUP_TINT_Q);
    return "rgb(" + r + ", " + g + ", " + b + ")";
  }
  function groupBarFor(key) {
    if (key === null) return UNGROUPED_BAR;
    return GROUP_PALETTE[groupColorIdx(key)];
  }
  function groupBgFor(key) {
    if (key === null) return UNGROUPED_BG;
    return groupBg(groupBarFor(key));
  }
  /* M5 rev2 R18: 접힌 헤더 대표 상태 1개.
     active ▶ > listening ● > unknown ◦ > inactive ○.
     blocked는 선두에 있어 그룹에 없다. */
  function groupSummaryOf(members) {
    var hasL = false, hasU = false;
    for (var i = 0; i < members.length; i++) {
      var st = members[i].status;
      if (st === "active") return { status: "active", glyph: "▶" };
      if (st === "listening") hasL = true;
      else if (st === "unknown") hasU = true;
    }
    if (hasL) return { status: "listening", glyph: "●" };
    if (hasU) return { status: "unknown", glyph: "◦" };
    return { status: "inactive", glyph: "○" };
  }
  /* M5 rev2 R17: 저장용 키. 미분류(null)는 "". Attention은 저장하지 않는다. */
  function collapseStoreKey(k) {
    return (k === null || k === undefined) ? "" : k;
  }
  function isCollapsed(k) {
    /* R15': blocked 선두("@attention")는 접히지 않아 항상 표시. */
    if (k === "@attention") return false;
    return !!state.collapsed[collapseStoreKey(k)];
  }
  function toggleCollapse(storeKey, restore) {
    /* R15': Attention 헤더가 없어 도달하지 않는 가드. */
    if (storeKey === "@attention") return;
    if (state.collapsed[storeKey]) delete state.collapsed[storeKey];
    else state.collapsed[storeKey] = true;
    saveCollapsed();
    /* 명시 조작이라 보류 중에도 즉시. */
    renderAgents(true);
    /* M5 rev2 R20: 키보드 토글에 한해 같은 키 헤더로 포커스 복원.
       클릭 토글은 복원하지 않는다 — 복원된 포커스가 hold를 만들어
       접힌 섹션 카드의 blocked 선두 이동(R19/R19')을 보류에 가두기 때문이다. */
    if (!restore) return;
    var heads = agentList.querySelectorAll(".agroup");
    for (var i = 0; i < heads.length; i++) {
      if (heads[i].getAttribute("data-skey") === storeKey) {
        try { heads[i].focus(); } catch (e) { /* 무시 */ }
        return;
      }
    }
  }
  /* M5 rev2 R13/R16/R18 + rev3 R15': 그룹 섹션 헤더 생성(Attention 헤더 없음).
     그룹·Ungrouped는 role=button + 셰브론 + 접기, 접힌 헤더에만 대표 아이콘 1개.
     전부 textContent(esc()는 HTML 이스케이프가 아니다). */
  function buildSectionHeader(s) {
    var h = document.createElement("div");
    h.className = "agroup";
    var labelText = s.label + " · " + s.members.length;
    var sk = collapseStoreKey(s.key);
    h.setAttribute("data-skey", sk);
    h.style.backgroundColor = groupBgFor(s.key);
    h.style.borderLeftColor = groupBarFor(s.key);
    h.setAttribute("role", "button");
    h.setAttribute("tabindex", "0");
    var collapsed = isCollapsed(s.key);
    h.setAttribute("aria-expanded", collapsed ? "false" : "true");
    var chev = document.createElement("span");
    chev.className = "agchev";
    chev.setAttribute("aria-hidden", "true");
    chev.textContent = collapsed ? "▸" : "▾";
    h.appendChild(chev);
    var lab = document.createElement("span");
    lab.className = "aglabel";
    lab.textContent = labelText;
    h.appendChild(lab);
    h.title = labelText;
    if (collapsed) {
      var sum = groupSummaryOf(s.members);
      var sg = document.createElement("span");
      sg.className = "agsum sg-" + sum.status;
      sg.textContent = sum.glyph;
      sg.title = sum.status;
      h.appendChild(sg);
    }
    (function (key) {
      h.addEventListener("click", function () { toggleCollapse(key, false); });
      h.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggleCollapse(key, true); }
      });
    })(sk);
    return h;
  }

  function renderWsOptions() {
    var counts = new Map();
    state.agents.forEach(function (a) {
      if (a.workspace === null || a.workspace === undefined || a.workspace === "") return;
      counts.set(a.workspace, (counts.get(a.workspace) || 0) + 1);
    });
    var keys = Array.from(counts.keys());
    /* 선택한 워크스페이스에 지금 에이전트가 없어도 선택은 유지한다(재기동 대기). */
    if (state.ws !== WS_ALL && keys.indexOf(state.ws) < 0) keys.push(state.ws);
    /* M5: 필터 옵션 정렬도 섹션과 같은 비교자(표시 라벨 대소문자 무시). */
    keys.sort(cmpGroupKey);
    /* M3-ui3: 옵션 라벨에 카운트를 붙이지 않는다("All", "label" 그대로).
       카운트 변화만으로는 다시 그리지 않는다. */
    var sig = state.ws + "|" + keys.map(function (k) {
      return k + "=" + (state.wsLabel.get(k) || "");
    }).join("|");
    if (wsFilter.getAttribute("data-sig") === sig) return;
    wsFilter.setAttribute("data-sig", sig);
    wsFilter.textContent = "";
    var all = document.createElement("option");
    all.value = WS_ALL;
    all.textContent = "All";
    wsFilter.appendChild(all);
    keys.forEach(function (k) {
      var o = document.createElement("option");
      o.value = k;
      var label = state.wsLabel.get(k) || (k.indexOf("dir:") === 0 ? k.slice(4) : k);
      o.textContent = label;
      o.title = label;
      wsFilter.appendChild(o);
    });
    wsFilter.value = state.ws;
    /* M3-ui3 추가요구2: fluid로 잘린 선택값의 전체 라벨은 select title로
       보여준다(option title은 드롭다운 쪽). */
    wsFilter.title = state.ws === WS_ALL ? "All"
      : (state.wsLabel.get(state.ws) || (state.ws.indexOf("dir:") === 0 ? state.ws.slice(4) : state.ws));
  }

  function applyMsgFilter() {
    var kids = msgList.children;
    for (var i = 0; i < kids.length; i++) {
      var m = kids[i]._msg;
      if (!m) continue;
      var hide = !msgVisible(m);
      if (kids[i].hidden !== hide) {
        kids[i].hidden = hide;
        if (!hide && !kids[i]._measured) pendingMeasure.push(kids[i]);
      }
    }
  }

  function setWs(k) {
    state.ws = (typeof k === "string" && k !== "") ? k : WS_ALL;
    try { window.localStorage.setItem(WS_KEY, state.ws); } catch (e) { /* 무시 */ }
    renderWsOptions();
    applyMsgFilter();
    applyView();
    renderAgents(true);
    renderTimeOnce();
    flushMeasure();
    if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
  }
  wsFilter.addEventListener("change", function () { setWs(wsFilter.value); });

  /* M3 활동순: blocked → pinned → active → listening → unknown → inactive,
     동률은 lastEventAt 내림차순(null은 뒤), 다음 name 오름차순. */
  function agentRank(a) {
    if (a.status === "blocked") return 0;
    if (state.pins[a.name]) return 1;
    if (a.status === "active") return 2;
    if (a.status === "listening") return 3;
    if (a.status === "unknown") return 4;
    return 5;
  }
  /* 내림차순 비교. null·undefined·""은 뒤. 같으면 0. */
  function cmpLastEventDesc(x, y) {
    var nx = (x === null || x === undefined || x === "");
    var ny = (y === null || y === undefined || y === "");
    if (nx && ny) return 0;
    if (nx) return 1;
    if (ny) return -1;
    return x < y ? 1 : (x > y ? -1 : 0);
  }

  function sortedAgents() {
    var vis = [];
    state.agents.forEach(function (a) {
      if (inWs(a.name)) vis.push(a);
    });
    /* 정렬 OFF = 기존 동작(blocked 먼저, 나머지 서버 순서).
       pinned은 OFF에서도 blocked 다음. */
    if (!state.sortOn) {
      var blocked = [], pinned = [], rest = [];
      vis.forEach(function (a) {
        if (a.status === "blocked") blocked.push(a);
        else if (state.pins[a.name]) pinned.push(a);
        else rest.push(a);
      });
      return blocked.concat(pinned, rest);
    }
    vis.sort(function (a, b) {
      var r = agentRank(a) - agentRank(b);
      if (r !== 0) return r;
      var t = cmpLastEventDesc(a.lastEventAt, b.lastEventAt);
      if (t !== 0) return t;
      return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
    });
    return vis;
  }

  function historyFor(name) {
    var out = [];
    for (var i = state.activities.length - 1; i >= 0; i--) {
      if (state.activities[i].agent === name) {
        out.push(state.activities[i]);
        if (out.length >= HISTORY_N) break;
      }
    }
    return out;
  }

  function activityLine(a) {
    return combineLine("tool:" + a.label, a.detail);
  }

  /* M5 rev3 R4': 섹션 모드 그룹 안 Sort OFF = pinned 먼저(서버 순서 유지),
     그다음 나머지 서버 순서. Sort ON은 sortMembers(blocked가 그룹에 없어
     agentRank pinned=1이 맨 위). */
  function pinnedFirstServerOrder(members) {
    var p = [], r = [];
    members.forEach(function (a) {
      if (state.pins[a.name]) p.push(a);
      else r.push(a);
    });
    return p.concat(r);
  }
  /* M5 rev3 + R15': 섹션 구성. blocked 카드(0명이면 없음)는 헤더 없이
     리스트 맨 앞. 그다음 그룹 섹션(미분류 포함, 표시 라벨 대소문자 무시
     정렬, 미분류 맨 끝). pinned는 자기 그룹 섹션 안 맨 위(ON: agentRank
     선두 / OFF: pinned-first). 필터=All이고 그룹 섹션이 2개 이상일 때만
     섹션 모드, 아니면 단일 리스트.
     단일 모드는 기존 sortedAgents 규칙(blocked → pinned → ...) 그대로. */
  function computeSections() {
    var vis = [];
    state.agents.forEach(function (a) {
      if (inWs(a.name)) vis.push(a);
    });
    var att = [], rest = [];
    vis.forEach(function (a) {
      if (isAttention(a)) att.push(a);
      else rest.push(a);
    });
    var byKey = new Map(), order = [];
    rest.forEach(function (a) {
      var k = groupKeyOf(a);
      if (!byKey.has(k)) { byKey.set(k, []); order.push(k); }
      byKey.get(k).push(a);
    });
    var sectionsMode = (state.ws === WS_ALL) && (order.length >= 2);
    var sections = [], attention = [];
    if (sectionsMode) {
      /* R15': blocked 카드는 헤더 없는 선두 행. Sort ON이면 정렬, OFF면 서버 순서. */
      attention = state.sortOn ? sortMembers(att.slice()) : att;
      order.sort(cmpGroupKey);
      order.forEach(function (k) {
        var members = byKey.get(k);
        sections.push({
          key: k,
          label: (k === null) ? "Ungrouped" : wsDisplayLabel(k),
          members: state.sortOn ? sortMembers(members.slice()) : pinnedFirstServerOrder(members)
        });
      });
    }
    return {
      mode: sectionsMode ? "sections" : "single",
      sections: sections,
      attention: attention,
      single: sectionsMode ? null : sortedAgents()
    };
  }

  /* M5 rev3 R6' + R15': blocked 선두 카드 head 안 상태 표시 바로 앞 그룹 라벨.
     pinned는 자기 섹션에 있어 라벨 없음. textContent로만 넣는다.
     label이 null이면 제거(섹션 이동 시 라벨 제거). */
  function syncWsLabel(wrap, label) {
    if (label === null || label === undefined) {
      if (wrap._wslabel && wrap._wslabel.parentNode) {
        wrap._wslabel.parentNode.removeChild(wrap._wslabel);
      }
      wrap._wslabel = null;
      return;
    }
    if (!wrap._wslabel) {
      wrap._wslabel = document.createElement("span");
      wrap._wslabel.className = "wslabel";
      wrap._head.insertBefore(wrap._wslabel, wrap._hact);
    }
    wrap._wslabel.textContent = label;
    wrap._wslabel.title = label;
  }

  /* M3: 이름별 노드 재사용. 새 이름만 만들고, 있는 건 내용만 갱신한다.
     explicit=true(핀·필터·정렬 토글 같은 명시 조작)는 보류 중에도 즉시 재정렬.
     자동 렌더는 보류 중이면 내용 갱신·신규/삭제만 하고 순서는 둔다.
     M5: 섹션 모드에서는 헤더(매 렌더 재생성) + 섹션별 카드 배치.
     보류 중에는 헤더·순서를 손대지 않고 신규 카드만 끝에 붙인다. */
  function renderAgents(explicit) {
  /* M5 rev2 R20: 헤더 제거 중 focused 헤더가 떨어지면 blur가 동기 실행돼
     focusout→syncHold→releaseHold→renderAgents로 재진입한다.
     재진입이 바깥 제거 루프와 같은 노드를 또 떼면 throw + 헤더 중복이다.
     재진입은 바깥 렌더가 같은 state로 끝내므로 orderPending만 남기고 돌아간다. */
  if (state.rendering) {
    if (!explicit) state.orderPending = true;
    return;
  }
  state.rendering = true;
  try {
    var plan = computeSections();
    var list;
    if (plan.mode === "sections") {
      /* R15': blocked 선두(헤더 없음) + 그룹 섹션 순서. */
      list = plan.attention.concat([]);
      plan.sections.forEach(function (s) {
        s.members.forEach(function (m) { list.push(m); });
      });
    } else {
      list = plan.single;
    }
    /* M3-ui2: 카운트는 타이틀 옆 "(N)" / "(보이는 수/N)". 숫자는 기존과 동일
       (전체 = state.agents.length, 필터 시 보이는 수/전체). */
    agentCount.textContent = "(" + (state.ws === WS_ALL ? "" : list.length + "/") +
      state.agents.length + ")";
    updateClearPins();
    if (!explicit && !state.agentsDirty && !state.orderPending) return;
    /* M3 rework B: hold 중 메시지 전용 렌더는 카드 렌더를 건너뛰고 orderPending만 유지. */
    if (!explicit && !state.agentsDirty && state.holdOrder) return;
    var reorder = explicit || !state.holdOrder;
    /* M5 rev3 R6' + R15': 이름 → blocked 선두 카드 표시 라벨. 아니면 null.
       보류 중에도 내용 갱신은 즉시(섹션 이동·헤더만 보류)라 새 소속 기준으로 둔다. */
    var attLabelOf = Object.create(null);
    if (plan.mode === "sections") {
      plan.attention.forEach(function (a) {
        var k = groupKeyOf(a);
        attLabelOf[a.name] = (k === null) ? "Ungrouped" : wsDisplayLabel(k);
      });
    }
    var seen = Object.create(null);
    /* M5 rev2: 이름 → 소속 섹션 키. 접힌 섹션 카드는 hidden(DOM 유지,
       카드 노드 재사용·M4 리스너 보존). blocked 선두는 "@attention" 취급 —
       접히지 않아 항상 표시. */
    var secOf = Object.create(null);
    if (plan.mode === "sections") {
      plan.attention.forEach(function (a) { secOf[a.name] = "@attention"; });
      plan.sections.forEach(function (s) {
        s.members.forEach(function (a) { secOf[a.name] = s.key; });
      });
    }
    var i, a, el;
    for (i = 0; i < list.length; i++) {
      a = list[i];
      seen[a.name] = true;
      el = state.cardOf.get(a.name);
      if (!el) {
        el = buildAgentCard(a);
        state.cardOf.set(a.name, el);
      } else {
        updateAgentCard(el, a);
      }
      syncWsLabel(el, attLabelOf[a.name] || null);
      /* M5 rev2 R19 / rev3 R19': 소속은 새 state 기준(내용 갱신은 즉시)이나,
         보류 중에는 기존 카드의 숨김을 손대지 않고 이동만 보류(R9).
         신규 카드는 소속대로 둔다. rev3에서 pinned는 그룹에 남아 접히면 숨겨진다. */
      var wantHidden = (plan.mode === "sections") ? isCollapsed(secOf[a.name]) : false;
      if (!el.parentNode) {
        el.hidden = wantHidden;
        agentList.appendChild(el);
      } else if (reorder) {
        el.hidden = wantHidden;
      }
    }
    state.cardOf.forEach(function (node, nm) {
      if (!seen[nm]) {
        if (node.parentNode === agentList) agentList.removeChild(node);
        state.cardOf.delete(nm);
      }
    });
    if (reorder) {
      /* M5: 헤더 노드는 매 렌더 재생성(비인터랙티브, 상태 없음).
         카드 Element 참조는 유지(이동만, 재생성 없음). */
      var oldHeads = agentList.querySelectorAll(".agroup");
      for (i = 0; i < oldHeads.length; i++) {
        if (oldHeads[i].parentNode === agentList) agentList.removeChild(oldHeads[i]);
      }
      if (plan.mode === "sections") {
        agentList.classList.add("sections");
        for (i = 0; i < plan.sections.length; i++) {
          (function (s) {
            /* M5 rev2: 띠·색·접기·요약 헤더. 재생성하되 카드 참조는 유지. */
            agentList.appendChild(buildSectionHeader(s));
            s.members.forEach(function (m) {
              var node = state.cardOf.get(m.name);
              if (node) agentList.appendChild(node);
            });
          })(plan.sections[i]);
        }
      } else {
        agentList.classList.remove("sections");
        for (i = 0; i < list.length; i++) {
          el = state.cardOf.get(list[i].name);
          if (el) agentList.appendChild(el);
        }
      }
      state.orderPending = false;
    } else {
      state.orderPending = true;
    }
    /* FR-15: 5명 이상일 때만 하단 스크롤. 4명 이하에서는 max-height를 두지 않아
       O-2①(무스크롤)을 구조적으로 보장한다. UI 배치 #3: 인라인 스타일 대신
       tall 클래스 + 상수로만 토글한다. 헤더는 세지 않고 카드 수 기준(R11). */
    if (list.length >= AGENT_TALL_MIN_N) {
      agentList.classList.add(AGENT_TALL_CLASS);
    } else {
      agentList.classList.remove(AGENT_TALL_CLASS);
    }
    state.agentsDirty = false;
  } finally {
    state.rendering = false;
  }
  }

  function displayNameOf(a) {
    var base = (a.tag !== null && a.tag !== undefined && a.tag !== "")
      ? a.tag + "/" + a.name : esc(a.name);
    return base + (a.unreadCount > 0 ? " (" + a.unreadCount + ")" : "");
  }

  /* M3-ui2: 핀 아이콘은 별(★/☆)이 아니라 압정 SVG. innerHTML에는 아래 정적
     문자열만 넣는다(이름 포함 금지). 고정 = 채움, 해제 = 외곽선. */
  var PIN_SVG_ON = '<svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="3.5"/><path d="M8 9v5" fill="none"/></svg>';
  var PIN_SVG_OFF = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="3.5"/><path d="M8 9v5"/></svg>';
  function refreshPinBtn(btn, name) {
    var on = !!state.pins[name];
    btn.textContent = "";
    btn.innerHTML = on ? PIN_SVG_ON : PIN_SVG_OFF;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.title = on ? name + " unpin" : name + " pin";
  }

  /* M4: focusable===false면 비활성 표시 + role/tabindex 제거(키보드 POST 차단).
     focusable 필드 누락(구 서버·하네스 합성)은 클릭 가능 취급. */
  function syncFocusState(card, node, a) {
    if (a.focusable === false) {
      node.removeAttribute("role");
      node.removeAttribute("tabindex");
      node.classList.add("nofocus");
      node.title = "Not running in cmux";
      card._focusable = false;
    } else {
      node.setAttribute("role", "button");
      node.setAttribute("tabindex", "0");
      node.classList.remove("nofocus");
      node.removeAttribute("title");
      card._focusable = true;
    }
  }

  /* M4: 이름 클릭 → POST /focus {name: data-agent(base_name)}. 표시 텍스트 금지.
     성공 시 표시 없음(포커스 이동 자체가 피드백). 실패 시 카드에 reason 텍스트를
     2~3초 보인다(textContent). 요청 중 같은 카드 재클릭은 무시, Abort 15초. */
  function focusAgent(card) {
    if (card._focusable === false) return;
    if (card._focusBusy) return;
    var name = card.getAttribute ? card.getAttribute("data-agent") : null;
    if (typeof name !== "string" || name === "") return;
    card._focusBusy = true;
    var ctl = null;
    try {
      if (typeof AbortController !== "undefined") ctl = new AbortController();
    } catch (e) { ctl = null; }
    var timer = 0;
    try {
      timer = setTimeout(function () {
        try { if (ctl) ctl.abort(); } catch (e) { /* 무시 */ }
      }, FOCUS_TIMEOUT_MS);
    } catch (e) { timer = 0; }
    function done() {
      card._focusBusy = false;
      if (timer) { try { clearTimeout(timer); } catch (e) { /* 무시 */ } }
    }
    var opts = {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name })
    };
    if (ctl) opts.signal = ctl.signal;
    fetch("/focus", opts).then(function (res) {
      return res.json().then(function (body) {
        return { status: res.status, body: body };
      }, function () {
        return { status: res.status, body: null };
      });
    }).then(function (r) {
      done();
      if (!r.body || r.body.ok !== true) {
        var reason = r.body && r.body.reason ? String(r.body.reason) : "error " + r.status;
        showFocusErr(card, focusErrText(reason, r.status), reason);
      }
    }, function () {
      done();
      showFocusErr(card, "Focus failed", "error");
    });
  }

  /* M4 fix: reason 코드는 title(원본)에, 화면에는 사람용 짧은 영어만.
     textContent 로만 넣는다(esc()는 HTML 이스케이프가 아니다). */
  function focusErrText(reason, status) {
    if (status === 404 || reason === "unknown_agent") return "Agent gone";
    if (reason === "no_cmux") return "cmux not available";
    if (reason === "not_in_cmux") return "Not running in cmux";
    if (reason && reason.indexOf("step:") === 0) return "Couldn't focus (" + reason.slice(5) + ")";
    if (reason === "not_selected") return "Tab not selected";
    if (reason === "order_changed") return "Tabs moved, try again";
    if (reason === "busy") return "Busy, try again";
    return "Focus failed";
  }

  function showFocusErr(card, text, title) {
    var n = card._focusErr;
    if (!n) {
      n = document.createElement("span");
      n.className = "focus-err";
      card.appendChild(n);
      card._focusErr = n;
    }
    n.textContent = String(text);
    if (title !== undefined && title !== null) n.title = String(title);
    if (card._focusTimer) { try { clearTimeout(card._focusTimer); } catch (e) { /* 무시 */ } }
    card._focusTimer = setTimeout(function () {
      if (n.parentNode === card) card.removeChild(n);
      if (card._focusErr === n) card._focusErr = null;
      card._focusTimer = 0;
    }, FOCUS_ERR_MS);
  }

  function buildAgentCard(a) {
    var wrap = document.createElement("div");
    wrap.className = "agent" + (a.status === "blocked" ? " blocked" : "");
    wrap.setAttribute("data-agent", a.name);

    var head = document.createElement("div");
    head.className = "head";
    var who = document.createElement("span");
    who.className = "who";
    var glyph = document.createElement("span");
    glyph.className = "sglyph sg-" + esc(a.status);
    glyph.textContent = statusGlyph(a.status);
    who.appendChild(glyph);
    var aname = document.createElement("span");
    aname.className = "aname";
    aname.textContent = displayNameOf(a);
    who.appendChild(aname);
    /* M4: 리스너는 이름 노드에 직접 부착(위임 금지). 카드 재사용 후에도 생존.
       핀·이력확장 버튼은 별도 노드라 버블링으로 이름 클릭을 일으키지 않는다. */
    (function (card, node) {
      node.addEventListener("click", function () { focusAgent(card); });
      node.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); focusAgent(card); }
      });
    })(wrap, aname);
    syncFocusState(wrap, aname, a);
    head.appendChild(who);
    var hact = document.createElement("span");
    hact.className = "hact";
    var st = document.createElement("span");
    st.className = "st st-" + esc(a.status);
    st.textContent = esc(a.status);
    hact.appendChild(st);
    (function (nm) {
      var pin = document.createElement("button");
      pin.className = "pinbtn";
      pin.setAttribute("aria-label", nm + " pin");
      pin.addEventListener("click", function () { togglePin(nm); });
      hact.appendChild(pin);
      wrap._pin = pin;
    })(a.name);
    head.appendChild(hact);
    head.setAttribute("data-agent", esc(a.name));
    wrap.appendChild(head);
    wrap._head = head;
    wrap._hact = hact;
    wrap._wslabel = null;
    wrap._glyph = glyph;
    wrap._aname = aname;
    wrap._who = who;
    wrap._st = st;
    wrap._badge = null;

    syncToolBadge(wrap, a);
    syncDirDesc(wrap, a);

    var cur = document.createElement("span");
    cur.className = "cur";
    cur.setAttribute("data-oracle", "current-line");
    cur.title = combineLine(a.statusContext, a.statusDetail);
    cur.textContent = combineLine(a.statusContext, a.statusDetail);
    wrap.appendChild(cur);
    wrap._cur = cur;

    wrap._dir = wrap._dir || null;
    wrap._desc = wrap._desc || null;
    wrap._histKey = null;
    wrap._hwrap = null;
    syncHwrap(wrap, a);

    refreshPinBtn(wrap._pin, a.name);
    return wrap;
  }

  function syncToolBadge(wrap, a) {
    var abbr = toolAbbr(a.tool);
    if (abbr === null) {
      if (wrap._badge && wrap._badge.parentNode === wrap._who) wrap._who.removeChild(wrap._badge);
      wrap._badge = null;
      return;
    }
    if (!wrap._badge) {
      wrap._badge = document.createElement("span");
      wrap._badge.className = "tool";
      wrap._who.appendChild(wrap._badge);
    }
    wrap._badge.setAttribute("data-tool", esc(a.tool));
    wrap._badge.textContent = abbr;
    wrap._badge.title = esc(a.tool);
  }

  function syncDirDesc(wrap, a) {
    /* 워크스페이스 경로. 홈은 ~ 로 줄인다. */
    if (a.directory !== null && a.directory !== undefined && a.directory !== "") {
      if (!wrap._dir) {
        wrap._dir = document.createElement("span");
        wrap._dir.className = "dir";
        wrap.appendChild(wrap._dir);
      }
      wrap._dir.textContent = String(a.directory).replace(/^\/Users\/[^\/]+(?=\/|$)/, "~");
      wrap._dir.title = String(a.directory);
    } else if (wrap._dir && wrap._dir.parentNode === wrap) {
      wrap.removeChild(wrap._dir);
      wrap._dir = null;
    }
    /* hcom이 description에 상태값을 그대로 내려(head 상태와 중복, 예: "listening")
       오는 경우에는 그리지 않는다. 실제 설명문은 그대로 둔다. */
    var descText = esc(a.description).trim();
    if (descText !== "" && descText.toLowerCase() !== esc(a.status).trim().toLowerCase()) {
      if (!wrap._desc) {
        wrap._desc = document.createElement("div");
        wrap._desc.className = "desc";
        wrap.appendChild(wrap._desc);
      }
      wrap._desc.textContent = esc(a.description);
    } else if (wrap._desc && wrap._desc.parentNode === wrap) {
      wrap.removeChild(wrap._desc);
      wrap._desc = null;
    }
  }

  /* 이력 영역. 바뀐 에이전트만 다시 만든다. N 상한은 HISTORY_N이 건다. */
  function syncHwrap(wrap, a) {
    var hs = historyFor(a.name);
    var key = hs.map(function (h) { return h.ts + "\n" + h.label + "\n" + (h.detail || ""); }).join("\n-\n");
    if (wrap._histKey === key) return;
    wrap._histKey = key;
    if (wrap._hwrap && wrap._hwrap.parentNode === wrap) wrap.removeChild(wrap._hwrap);
    wrap._hwrap = null;
    if (hs.length === 0) return;
    (function (nm) {
      var hw = document.createElement("div");
      hw.className = "hwrap";
      hw.setAttribute("data-histwrap", esc(nm));
      var shown = Math.min(HIST_DEFAULT_N, hs.length);
      for (var hi = 0; hi < shown; hi++) {
        var hline = document.createElement("span");
        hline.className = "hist";
        hline.textContent = fmtTime(hs[hi].ts) + " " + activityLine(hs[hi]);
        hw.appendChild(hline);
      }
      var moreBtn = document.createElement("button");
      moreBtn.className = "hexpand";
      moreBtn.setAttribute("aria-label", nm + " view full history");
      moreBtn.title = nm + " view full history";
      moreBtn.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h5v5M14 2L9 7M7 14H2V9M2 14l5-5"/></svg>';
      moreBtn.addEventListener("click", function () { openHistModal(nm); });
      hw.appendChild(moreBtn);
      wrap.appendChild(hw);
      wrap._hwrap = hw;
    })(a.name);
  }

  function updateAgentCard(el, a) {
    el.className = "agent" + (a.status === "blocked" ? " blocked" : "");
    el._glyph.className = "sglyph sg-" + esc(a.status);
    el._glyph.textContent = statusGlyph(a.status);
    el._aname.textContent = displayNameOf(a);
    syncFocusState(el, el._aname, a);
    syncToolBadge(el, a);
    el._st.className = "st st-" + esc(a.status);
    el._st.textContent = esc(a.status);
    refreshPinBtn(el._pin, a.name);
    syncDirDesc(el, a);
    el._cur.title = combineLine(a.statusContext, a.statusDetail);
    el._cur.textContent = combineLine(a.statusContext, a.statusDetail);
    syncHwrap(el, a);
  }

  function renderTime() {
    timeList.textContent = "";
    var acts = state.activities.filter(function (a) { return inWs(a.agent); }).sort(function (x, y) {
      return (x.ts < y.ts ? 1 : (x.ts > y.ts ? -1 : 0));
    });
    acts.forEach(function (a) {
      var row = document.createElement("span");
      row.className = "trow";
      var kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = esc(a.kind);
      row.appendChild(kind);
      var tt = document.createElement("span");
      tt.className = "tt";
      tt.textContent = fmtTime(a.ts) + " " + a.agent + " ";
      row.appendChild(tt);
      row.appendChild(document.createTextNode(activityLine(a)));
      row.title = fmtTime(a.ts) + " " + a.agent + " " + activityLine(a);
      timeList.appendChild(row);
    });
    /* 상단 영역은 #msgPane 스크롤에 맡긴다. 하단 FR-15 max-height와 무관.
       UI 배치 #3: max-height는 CSS(#timeList{max-height:none})로만 둔다. */
  }

  /* FR-10: 상단은 로그/시간순 탭, 하단은 에이전트별 뷰 고정.
     UI 배치 #2: applyView는 렌더 1회(renderAgents)만 한다.
     timeList 렌더는 시간순 뷰일 때 renderTimeOnce가 따로 맡아
     로그탭에서 숨은 목록을 그리지 않는다. */
  function applyView() {
    var isLog = state.view === "log";
    msgList.hidden = !isLog;
    timeList.hidden = isLog;
    tabLogBtn.setAttribute("aria-pressed", isLog ? "true" : "false");
    tabTimeBtn.setAttribute("aria-pressed", isLog ? "false" : "true");
    renderAgents(false);
  }
  function renderTimeOnce() {
    if (state.view === "time") renderTime();
  }

  /* FR-11 개정: 모달은 최대 MODAL_HISTORY_MAX=20건. 기본 2건(historyFor)과
     별도 경로다. 보관량: 에이전트 7명×20건=140 ≤ BUFFER_MAX=200이라
     버퍼 증량 없이 전원 20건을 담는다. */
  function modalHistories(name) {
    var out = [];
    for (var i = state.activities.length - 1; i >= 0; i--) {
      if (state.activities[i].agent === name) out.push(state.activities[i]);
    }
    return out.slice(0, MODAL_HISTORY_MAX);
  }
  /* FR-11 모달: N 상한은 MODAL_HISTORY_MAX가 건다. */
  var histModal = $("histModal"), histTitle = $("histTitle"),
      histBody = $("histBody"), histClose = $("histClose");
  function openHistModal(name) {
    var hs = modalHistories(name);
    histTitle.textContent = name + " history " + hs.length + "/" + MODAL_HISTORY_MAX;
    histBody.textContent = "";
    if (hs.length === 0) {
      var p = document.createElement("div");
      p.className = "mrow";
      p.textContent = "No history";
      histBody.appendChild(p);
    }
    hs.forEach(function (h) {
      var row = document.createElement("div");
      row.className = "mrow";
      row.textContent = fmtTime(h.ts) + " " + activityLine(h);
      histBody.appendChild(row);
    });
    histModal.hidden = false;
    histClose.focus();
  }
  function closeHistModal() { histModal.hidden = true; }
  histClose.addEventListener("click", closeHistModal);
  histModal.addEventListener("click", function (ev) {
    if (ev.target === histModal) closeHistModal();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !histModal.hidden) closeHistModal();
    else if (ev.key === "Escape" && isSettingsOpen()) {
      setSettingsOpen(false);
      agentSettings.focus();
    }
  });

  function setView(v) {
    if (v !== "log" && v !== "time") return;
    state.view = v;
    try { window.localStorage.setItem(VIEW_KEY, v); } catch (e) { /* 무시 */ }
    applyView();
    renderTimeOnce();
    /* M3: Timeline에 있는 동안 쌓인 측정 큐는 Log 복귀 시 처리한다. */
    flushMeasure();
  }

  tabLogBtn.addEventListener("click", function () { setView("log"); });
  tabTimeBtn.addEventListener("click", function () { setView("time"); });

  /* --- M3: 핀·정렬·간략 보기 --- */

  /* 핀 토글 시 msgList 전체(hidden 행 포함)의 [data-who]를 순회해 클래스만
     토글. 메시지 재생성 금지, _msg/expanded/_measured 보존. */
  function retogglePinned() {
    var spans = msgList.querySelectorAll("[data-who]");
    for (var i = 0; i < spans.length; i++) {
      var on = !!state.pins[spans[i].getAttribute("data-who")];
      if (on) spans[i].classList.add("pinned");
      else spans[i].classList.remove("pinned");
    }
  }

  /* Clear pins는 핀이 1개 이상일 때만 노출. */
  function updateClearPins() {
    var n = Object.keys(state.pins).length;
    clearPins.hidden = n === 0;
  }

  function refreshAllPinBtns() {
    state.cardOf.forEach(function (node, nm) {
      if (node._pin) refreshPinBtn(node._pin, nm);
    });
    updateClearPins();
  }

  function togglePin(name) {
    if (state.pins[name]) delete state.pins[name];
    else state.pins[name] = true;
    savePins();
    refreshAllPinBtns();
    retogglePinned();
    /* 명시 조작은 보류 중에도 즉시 재정렬. */
    renderAgents(true);
    if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
  }

  clearPins.addEventListener("click", function () {
    state.pins = Object.create(null);
    savePins();
    refreshAllPinBtns();
    retogglePinned();
    renderAgents(true);
    if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
  });

  function setSort(on) {
    state.sortOn = on;
    try { window.localStorage.setItem(SORT_KEY, on ? "1" : "0"); } catch (e) { /* 무시 */ }
    sortToggle.setAttribute("aria-pressed", on ? "true" : "false");
    renderAgents(true);
  }
  sortToggle.addEventListener("click", function () { setSort(!state.sortOn); });

  function setCompact(on) {
    state.compact = on;
    try { window.localStorage.setItem(COMPACT_KEY, on ? "1" : "0"); } catch (e) { /* 무시 */ }
    if (on) document.body.classList.add("compact");
    else document.body.classList.remove("compact");
    compactToggle.setAttribute("aria-pressed", on ? "true" : "false");
  }
  compactToggle.addEventListener("click", function () { setCompact(!state.compact); });

  /* M3-ui3: 헤더 설정 버블. 버블 안 토글을 눌러도 버블은 열린 채 유지한다.
     닫힘: 설정 버튼 재클릭·버블 밖 클릭·Esc. Esc로 닫으면 포커스를 되돌린다.
     버블은 #agentHeader 안에 있어 #agentList hold(pointer/focus) 판정에 닿지 않는다. */
  function isSettingsOpen() { return !agentSettingsPop.hidden; }
  function setSettingsOpen(open) {
    agentSettingsPop.hidden = !open;
    agentSettings.setAttribute("aria-expanded", open ? "true" : "false");
  }
  agentSettings.addEventListener("click", function () { setSettingsOpen(!isSettingsOpen()); });
  document.addEventListener("click", function (ev) {
    if (agentSettingsPop.hidden) return;
    var t = ev ? ev.target : null;
    if (t && (agentSettings.contains(t) || agentSettingsPop.contains(t))) return;
    setSettingsOpen(false);
  });

  /* 자동 재정렬만 보류. 핀·필터·정렬 토글 같은 명시 조작은 renderAgents(true)로
     즉시 간다. 보류 해제 시 최신 state로 1회 재정렬. */
  function releaseHold() {
    if (state.orderPending) {
      state.orderPending = false;
      renderAgents(true);
    }
  }
  /* M3 rework A: pointer/focus 독립 추적. holdOrder = pointerInside || focusInside.
     둘 다 false일 때만 releaseHold. */
  function syncHold() {
    state.holdOrder = !!(state.pointerInside || state.focusInside);
    if (!state.holdOrder) releaseHold();
  }
  agentList.addEventListener("mouseenter", function () {
    state.pointerInside = true;
    state.holdOrder = true;
  });
  agentList.addEventListener("mouseleave", function () {
    state.pointerInside = false;
    syncHold();
  });
  agentList.addEventListener("focusin", function () {
    state.focusInside = true;
    state.holdOrder = true;
  });
  agentList.addEventListener("focusout", function (ev) {
    var to = ev.relatedTarget;
    if (to && agentList.contains(to)) return;
    state.focusInside = false;
    syncHold();
  });

  /* 메시지: 최신이 아래, 자동 스크롤(맨 아래 근처일 때만 따라감). */
  var msgPane = $("msgPane");
  var stickToBottom = true;
  msgPane.addEventListener("scroll", function () {
    stickToBottom = (msgPane.scrollHeight - msgPane.scrollTop - msgPane.clientHeight) < 24;
  });

  /* M3: 발신인·각 수신인을 개별 span(dataset.who)으로 만든다.
     이름은 createElement + textContent로만 넣는다. esc()는 HTML 이스케이프가
     아니라서 innerHTML에 이름을 넣으면 P6(XSS)이 뚫린다.
     `@`·쉼표·화살표는 별도 텍스트 노드. 신규 메시지는 append 시점 핀을 바로 입힌다. */
  function whoSpan(name) {
    var s = document.createElement("span");
    s.setAttribute("data-who", name);
    s.textContent = name;
    if (state.pins[name]) s.classList.add("pinned");
    return s;
  }

  function appendMessage(m) {
    var wrap = document.createElement("div");
    wrap.className = "msg";
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.appendChild(document.createTextNode("● "));
    meta.appendChild(whoSpan(m.from));
    meta.appendChild(document.createTextNode(" → "));
    if (m.to && m.to.length) {
      for (var ti = 0; ti < m.to.length; ti++) {
        if (ti > 0) meta.appendChild(document.createTextNode(","));
        meta.appendChild(document.createTextNode("@"));
        meta.appendChild(whoSpan(m.to[ti]));
      }
    } else {
      meta.appendChild(document.createTextNode("(all)"));
    }
    meta.appendChild(document.createTextNode("  "));
    if (m.intent) {
      var chip = document.createElement("span");
      chip.className = "intent";
      chip.textContent = m.intent;
      meta.appendChild(chip);
    }
    var ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = "  " + fmtTime(m.ts);
    meta.appendChild(ts);
    var exp = document.createElement("span");
    exp.className = "exp";
    exp.setAttribute("aria-hidden", "true");
    exp.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
    meta.appendChild(exp);
    var text = document.createElement("div");
    text.className = "text";
    text.textContent = foldBlankLines(esc(m.text));
    text.title = esc(m.text);
    wrap.appendChild(meta);
    wrap.appendChild(text);
    wrap._msg = { from: m.from, to: m.to };
    wrap.hidden = !msgVisible(m);
    msgList.appendChild(wrap);
    while (msgList.children.length > BUFFER_MAX) {
      msgList.removeChild(msgList.firstChild);
    }
    /* 말줄임 판정(scrollHeight 읽기)은 강제 레이아웃이라 메시지마다 하지 않고
       다음 프레임에 모아서 한다. 숨은 메시지는 높이가 0이라 보일 때 판정한다. */
    if (!wrap.hidden) pendingMeasure.push(wrap);
    scheduleRender();
  }

  var pendingMeasure = [];
  function flushMeasure() {
    /* M3: msgList가 hidden(Timeline 탭)일 때는 측정하지 않고 큐에 남긴다.
       Log 탭 복귀(setView) 시 측정한다. */
    if (msgList.hidden) return;
    if (pendingMeasure.length === 0) return;
    var batch = pendingMeasure;
    pendingMeasure = [];
    /* 읽기를 모두 끝낸 뒤 쓴다(레이아웃 스래싱 방지). */
    var over = batch.map(function (w) {
      if (w.hidden || w._measured || !w.parentNode) return false;
      var t = w.lastChild;
      return t.scrollHeight > t.clientHeight + 1;
    });
    batch.forEach(function (w, i) {
      if (w.hidden || w._measured || !w.parentNode) return;
      w._measured = true;
      if (over[i]) markClamped(w);
    });
  }

  /* 펼칠 내용이 있을 때만 role·핸들러를 건다. */
  function markClamped(wrap) {
    var meta = wrap.firstChild;
    wrap.classList.add("clamped");
    meta.setAttribute("role", "button");
    meta.setAttribute("tabindex", "0");
    meta.setAttribute("aria-expanded", "false");
    meta.title = "Click to expand/collapse";
    meta.addEventListener("click", function () {
      var on = wrap.classList.toggle("expanded");
      meta.setAttribute("aria-expanded", on ? "true" : "false");
      if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
    });
    meta.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); meta.click(); }
    });
  }

  /* 렌더 병합: 이벤트마다 전체를 다시 그리지 않고 한 프레임에 한 번만 그린다.
     접속 직후 backlog 200건이 한꺼번에 들어올 때 전체 재렌더 200회가 1회가 된다. */
  var renderPending = false;
  function scheduleRender() {
    if (renderPending) return;
    renderPending = true;
    window.requestAnimationFrame(flushRender);
  }
  function flushRender() {
    renderPending = false;
    applyView();
    renderTimeOnce();
    flushMeasure();
    if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
    refreshStale();
  }

  /* --- 이벤트 처리 --- */

  function onSnapshot(ev) {
    if (!checkVersion(ev)) return;
    /* SCHEMA §3-4: 재연결 후 첫 snapshot에 중복 배제 윈도 파기. */
    if (state.needClearOnSnapshot) {
      state.seenIds.clear();
      state.needClearOnSnapshot = false;
    }
    /* SCHEMA §3-5: agents는 전량. 없는 에이전트는 사라진 것으로 교체한다. */
    state.agents = Array.isArray(ev.agents) ? ev.agents : [];
    state.agents.forEach(function (a) {
      if (a.workspace === null || a.workspace === undefined || a.workspace === "") return;
      state.wsOf.set(a.name, a.workspace);
      if (a.workspaceLabel) state.wsLabel.set(a.workspace, a.workspaceLabel);
    });
    /* M3: snapshot에서 사라진 이름의 핀도 지운다. */
    (function () {
      var aliveNow = Object.create(null);
      state.agents.forEach(function (a) { aliveNow[a.name] = true; });
      var pruned = false, nm;
      for (nm in state.pins) {
        if (Object.prototype.hasOwnProperty.call(state.pins, nm) && !aliveNow[nm]) {
          delete state.pins[nm];
          pruned = true;
        }
      }
      if (pruned) {
        savePins();
        retogglePinned();
      }
    })();
    state.agentsDirty = true;
    renderWsOptions();
    applyMsgFilter();
    scheduleRender();
  }

  function onActivity(ev) {
    if (!checkVersion(ev)) return;
    if (ev.id !== null && ev.id !== undefined) {
      if (state.seenIds.has(ev.id)) return;
      state.seenIds.add(ev.id);
      if (state.seenIds.size > 1000) {
        var first = state.seenIds.values().next().value;
        state.seenIds.delete(first);
      }
    }
    state.activities.push({
      id: ev.id, ts: ev.ts, agent: ev.agent,
      kind: ev.kind, label: ev.label, detail: ev.detail
    });
    while (state.activities.length > BUFFER_MAX) state.activities.shift();
    /* M3: 이력은 카드 이력 영역에 보이므로 카드도 더티. 메시지만 올 때는 서지 않는다. */
    state.agentsDirty = true;
    scheduleRender();
  }

  function onMessage(ev) {
    if (!checkVersion(ev)) return;
    if (ev.id !== null && ev.id !== undefined) {
      if (state.seenIds.has(ev.id)) return;
      state.seenIds.add(ev.id);
    }
    appendMessage(ev);
    refreshStale();
  }

  function onHealth(ev) {
    if (!checkVersion(ev)) return;
    state.healthOk = ev.ok === true;
    state.healthSource = ev.source !== undefined ? ev.source : null;
    state.healthReason = ev.reason !== undefined ? ev.reason : null;
    refreshStale();
  }

  function onHeartbeat(ev) {
    if (!checkVersion(ev)) return;
    state.lastHeartbeatAt = Date.now();
    refreshStale();
  }

  /* --- heartbeat 감시 (SCHEMA §3-11) ---
     setInterval 금지. paint(rAF)·visibilitychange 시점의 Date.now() 차분으로만 감시한다. */
  function tick() {
    refreshStale();
    window.requestAnimationFrame(tick);
  }
  document.addEventListener("visibilitychange", function () {
    refreshStale();
  });

  /* --- 기동 --- */

  function boot() {
    var params = new URLSearchParams(window.location.search);
    var fixturePath = params.get("fixture");
    var forceSample = params.get("sample") === "1";

    /* M3: 저장된 토글 상태를 헤더·본문에 반영. */
    sortToggle.setAttribute("aria-pressed", state.sortOn ? "true" : "false");
    compactToggle.setAttribute("aria-pressed", state.compact ? "true" : "false");
    if (state.compact) document.body.classList.add("compact");

    fetch("/version")
      .then(function (res) { return res.json(); })
      .then(function (v) {
        if (v && typeof v.minClientV === "number") minClientV = v.minClientV;
      })
      .catch(function () { /* 버전 조회 실패는 오프라인 폴백에서 처리 */ })
      .then(function () {
        if (forceSample) {
          loadSample("Sample mode (?sample=1)");
          return;
        }
        if (fixturePath) {
          loadFixture(fixturePath);
          return;
        }
        if (typeof window.EventSource === "undefined") {
          loadSample("No EventSource — showing sample");
          return;
        }
        connect();
      });

    window.requestAnimationFrame(tick);
    applyView();
  }

  function connect() {
    var es;
    try {
      es = new window.EventSource("/events");
    } catch (e) {
      loadSample("Connection failed — showing sample");
      return;
    }
    var gotSnapshot = false;
    var failTimer = null;

    es.onopen = function () {
      state.openedCount += 1;
      /* 재연결이면 다음 snapshot이 중복 윈도 파기의 신호다 (§3-4). */
      if (state.openedCount > 1) state.needClearOnSnapshot = true;
      state.lastHeartbeatAt = Date.now();
      state.everConnected = true;
      setConn(null);
      refreshStale();
    };
    es.addEventListener("snapshot", function (e) {
      gotSnapshot = true;
      try { onSnapshot(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("activity", function (e) {
      try { onActivity(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("message", function (e) {
      try { onMessage(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("health", function (e) {
      try { onHealth(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("heartbeat", function (e) {
      try { onHeartbeat(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.onerror = function () {
      /* EventSource는 자동 재시도한다. 첫 snapshot 전 실패면 예시로 기립한다
         (SCHEMA §5: 실서버 없이 화면이 떠야 한다). */
      if (!gotSnapshot && !state.everConnected) {
        loadSample("No server — showing sample (OFFLINE)");
      } else {
        setConn("Disconnected — reconnecting…");
      }
    };
    /* failTimer를 쓰지 않는다: setTimeout도 백그라운드 스로틀 대상이며,
       예시 폴백은 onerror 경로 하나로만 처리한다. */
    void failTimer;
  }

  /* SCHEMA §1 예시 페이로드 기반 내장 샘플.
     실서버 없이 화면이 서는 것이 W1·W2 동시 진행의 전제다 (§5). */
  function sampleEvents() {
    var now = new Date();
    var iso = now.toISOString();
    var old = new Date(now.getTime() - 26 * 3600 * 1000).toISOString();
    return {
      snapshot: {
        v: 1, ts: iso,
        agents: [
          { name: "lune", tag: "w1", status: "active", statusContext: "tool:Bash",
            statusDetail: "bun run src/server.ts", description: "Server/SSE",
            directory: "/Users/x/mushline", unreadCount: 0, lastEventAt: iso },
          { name: "nova", tag: null, status: "blocked", statusContext: "approval",
            statusDetail: "Bash", description: "Frontend rendering",
            directory: "/Users/x/mushline", unreadCount: 0, lastEventAt: iso },
          { name: "sona", tag: null, status: "listening", statusContext: null,
            statusDetail: null, description: "Docs",
            directory: "/Users/x/mushline", unreadCount: 0, lastEventAt: old }
        ]
      },
      activities: [
        { v: 1, id: "sample-1", ts: iso, agent: "lune",
          kind: "tool", label: "Edit", detail: "src/server.ts" },
        { v: 1, id: "sample-2", ts: iso, agent: "nova",
          kind: "cmd", label: "Bash", detail: "bun test --watch" }
      ],
      messages: [
        { v: 1, id: "sample-m1", ts: iso, from: "lune", to: ["nova"],
          intent: "request", thread: null, text: "Boundary schema v1 pushed" },
        { v: 1, id: "sample-m2", ts: iso, from: "nova", to: ["lune"],
          intent: "ack", thread: null, text: "Got it. Wiring up render" }
      ]
    };
  }

  function loadSample(label) {
    var s = sampleEvents();
    setConn(label);
    onSnapshot(s.snapshot);
    s.activities.forEach(onActivity);
    s.messages.forEach(onMessage);
  }

  /* W1의 fixtures/oracle-set.json 갈아끼우기 경로. 형태가 다르면 경고를 낸다. */
  function loadFixture(path) {
    fetch(path)
      .then(function (res) { return res.json(); })
      .then(function (f) {
        setConn("fixture: " + path);
        var snap = f.snapshot || f;
        if (snap && Array.isArray(snap.agents)) onSnapshot(snap);
        var acts = f.activities || f.activity || [];
        acts.forEach(onActivity);
        var msgs = f.messages || f.message || [];
        msgs.forEach(onMessage);
      })
      .catch(function () {
        loadSample("Fixture failed — showing sample (OFFLINE)");
      });
  }

  boot();
})();
</script>
</body>
</html>
