<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mushline</title>
<style>
  :root {
    --bg: #14151f; --surface: #1c1e29; --surface-2: #242736;
    --fg: #e6e8ef; --muted: #9aa0b4; --faint: #6f7590;
    --border: #282b3a; --border-strong: #3a3e54;
    --accent: oklch(72% 0.13 250);
    --danger: #ff7b7b; --warn: #e0c060; --ok: #7dd87d; --idle: #8e8e93;
    --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-width: 277px;
    max-width: 100%;
    overscroll-behavior: none;
    /* NOTE(O-1): 조상 전수에 overflow-x:hidden 금지. 잘림 은폐가 아니라
       셀 ellipsis + 줄바꿈으로 폭을 맞춘다. */
  }
  body {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg);
    background: var(--bg);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .banner {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    font-size: 12px;
    letter-spacing: 0.02em;
    line-height: 1.5;
    padding: 8px 12px;
    overflow-wrap: break-word;
    word-break: break-word;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  }
  .banner[hidden] { display: none; }
  #staleBanner { background: #5a1f1f; color: #ffd9d9; }
  #connBanner { background: #4a3a12; color: #ffe9a8; }
  #vBanner { background: #3a2a5a; color: #ddd0ff; }
  #layout {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    min-width: 277px;
    max-width: 100%;
  }
  #msgPane {
    flex: 1 1 55%;
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    overflow-anchor: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 0;
  }
  .msg {
    margin: 0;
    padding: 6px 8px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    min-width: 0;
  }
  .msg .meta {
    position: relative;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: #9ecfff;
    overflow-wrap: break-word;
    word-break: break-word;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .msg .meta .intent {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .msg .meta .intent::before { content: "· "; }
  .msg .text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg);
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-width: 65ch;
  }
  .msg .ts { color: var(--faint); }
  .msg.clamped .meta, .msg.expanded .meta { cursor: pointer; padding-right: 18px; }
  .msg.clamped .meta:hover, .msg.expanded .meta:hover { color: #c4dcff; }
  .msg:hover, .trow:hover { background: rgba(255,255,255,0.03); }
  .msg.expanded .text {
    display: block;
    overflow: visible;
  }
  .msg .exp {
    display: none;
    position: absolute;
    right: 0;
    top: 1px;
    color: var(--faint);
  }
  .msg .exp svg { display: block; }
  .msg.clamped .exp, .msg.expanded .exp { display: inline-flex; }
  .msg.expanded .exp svg { transform: rotate(180deg); }
  #divider {
    flex: 0 0 auto;
    height: 1px;
    background: var(--border-strong);
  }
  #topTabs {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
    min-width: 0;
    flex: 0 0 auto;
  }
  #viewToggle { display: flex; gap: 4px; min-width: 0; }
  #agentHeader .hleft { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #agentHeader .title, #agentHeader .count { flex: none; }
  #wsFilter {
    flex: 1 1 auto;
    min-width: 48px;
    max-width: 100%;
    min-height: 24px;
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 2px 4px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
  }
  #wsFilter:hover { color: var(--fg); }
  .msg[hidden] { display: none; }
  #viewToggle button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.02em;
    font-weight: 600;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    min-height: 32px;
    min-width: 44px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #viewToggle button:hover { background: rgba(255,255,255,0.05); color: var(--fg); }
  #viewToggle button[aria-pressed="true"] {
    background: rgba(255,255,255,0.1);
    color: var(--fg);
  }
  #agentPane {
    flex: 1 1 45%;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #agentHeader {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
    min-width: 0;
  }
  #agentHeader .title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #agentHeader .count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.02em;
  }
  #agentList, #timeList {
    min-width: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  #agentList { flex: 1 1 auto; min-height: 0; }
  /* UI 배치 #3: FR-15 max-height는 인라인 스타일이 아니라 tall 클래스로만 건다. */
  #agentList.tall { max-height: 100%; }
  /* 상단 목록은 #msgPane 스크롤에 맡긴다. max-height를 두지 않는다. */
  #timeList { max-height: none; }
  /* FR-11: 이력 영역 클릭 → 모달. N 상한은 HISTORY_N이 건다. */
  .hwrap { position: relative; min-width: 0; border-radius: 4px; }
  .hwrap .hist { padding-right: 26px; }
  .hexpand {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
  }
  .hexpand svg { width: 12px; height: 12px; }
  .hexpand:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
  #histModal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    background: rgba(0,0,0,.6);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 8px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  #histModal[hidden] { display: none; }
  #histDlg {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    max-width: 100%;
    max-height: 80vh;
    max-height: 80dvh;
    overflow-y: auto;
    padding: 8px;
  }
  #histDlg .mhead {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--muted);
    padding: 4px 0 8px 0;
  }
  #histTitle {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #histDlg .mrow {
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--fg);
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  #histDlg .mrow:hover { background: rgba(255,255,255,0.03); }
  .agent {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    min-width: 0;
  }
  .agent:hover { background: rgba(255,255,255,0.03); }
  .agent.blocked {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #241f2b;
    border-left: 3px solid #e05353;
  }
  .agent .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-width: 0;
    margin-bottom: 4px;
  }
  .agent .aname {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .agent .who { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .agent .tool {
    flex: none;
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--faint);
    margin-left: 2px;
    padding: 0;
    white-space: nowrap;
  }
  .agent .tool::before {
    content: "";
    width: 1px;
    height: 10px;
    background: var(--border-strong);
    margin-right: 6px;
  }
  .agent .sglyph { flex: none; font-size: 11px; }
  .sg-active { color: var(--ok); }
  .sg-listening { color: var(--warn); }
  .sg-blocked { color: var(--danger); }
  .sg-inactive, .sg-unknown { color: var(--idle); }
  .agent .st {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .st-active { color: var(--ok); }
  .st-listening { color: var(--warn); }
  .st-blocked { color: var(--danger); }
  .st-inactive, .st-unknown { color: var(--idle); }
  .agent .dir {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .agent .desc {
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    overflow-wrap: break-word;
    word-break: break-word;
    margin-bottom: 4px;
    max-width: 65ch;
  }
  /* O-3 측정 셀. 이 셀에만 ellipsis용 overflow를 둔다. */
  .cur {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    color: var(--fg);
  }
  .hist {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  #histClose {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
  }
  #histClose:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
  #histClose svg { width: 14px; height: 14px; }
  .trow {
    display: block;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
  }
  .trow .tt { color: var(--faint); }
  .trow .kind {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 0 4px;
    margin-right: 4px;
    color: var(--muted);
  }
  /* M3-ui3: 헤더는 277px에서 1줄 유지. 설정 버튼 1개만 두어 줄바꿈하지 않는다. */
  #agentHeader { flex-wrap: nowrap; }
  #agentHeader .hleft {
    flex: 1 1 auto;
    overflow: hidden;
  }
  /* M3-ui3: 설정 버튼 래퍼. 헤더 오른쪽 끝 고정 + 버블 위치 기준. */
  #agentHeader .hsetwrap {
    position: relative;
    flex: none;
    margin-left: auto;
  }
  #agentSettings {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
  }
  #agentSettings:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
  #agentSettings[aria-expanded="true"] { color: var(--fg); background: rgba(255,255,255,0.1); }
  #agentSettings svg { width: 16px; height: 16px; display: block; }
  /* M3-ui3: 설정 버블. 버튼 아래 오른쪽 정렬, 리스트 위에 겹침.
     z-index 5 = sticky blocked 카드(1) 위, 이력 모달(10) 아래. */
  #agentSettingsPop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 150px;
    max-width: 200px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  #agentSettingsPop[hidden] { display: none; }
  #agentSettingsPop .hbtn {
    display: flex;
    width: 100%;
    text-align: left;
    justify-content: flex-start;
    align-items: center;
    gap: 6px;
  }
  /* M3-D1: 버블 안 토글 켜짐 식별. 색만이 아닌 체크+굵기로 구분.
     ::before 빈칸(꺼짐/비토글) vs ✓(켜짐). Clear pins는 토글이 아니라 항상 빈칸. */
  #agentSettingsPop .hbtn::before {
    content: "";
    flex: none;
    width: 12px;
    text-align: center;
    font-size: 11px;
    line-height: 1;
  }
  #agentSettingsPop #sortToggle[aria-pressed="true"]::before,
  #agentSettingsPop #compactToggle[aria-pressed="true"]::before {
    content: "✓";
  }
  #agentSettingsPop .hbtn[aria-pressed="true"] {
    color: var(--fg);
    background: rgba(255,255,255,0.1);
    font-weight: 700;
  }
  .hbtn {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 2px 6px;
    min-height: 24px;
    cursor: pointer;
    white-space: nowrap;
  }
  .hbtn:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
  .hbtn[aria-pressed="true"] { color: var(--fg); background: rgba(255,255,255,0.1); }
  .hbtn[hidden] { display: none; }
  /* M3: 카드 head 우측 묶음(상태 + 핀). */
  .agent .hact {
    flex: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .agent .pinbtn {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
    font-size: 12px;
    line-height: 1;
  }
  .agent .pinbtn:hover { color: var(--fg); background: rgba(255,255,255,0.06); }
  .agent .pinbtn[aria-pressed="true"] { color: var(--warn); }
  /* M3-ui2: 핀 압정 SVG 크기. width/height 속성과 동일. */
  .agent .pinbtn svg { width: 12px; height: 12px; display: block; }
  /* M3 간략 보기: dir·desc·hwrap 숨김, cur는 기존 1줄 말줄임 그대로. */
  body.compact .agent .dir,
  body.compact .agent .desc,
  body.compact .agent .hwrap { display: none; }
  /* M3 핀 강조: Log 탭 이름 span. */
  .msg .meta [data-who].pinned { color: var(--warn); font-weight: 700; }
</style>
</head>
<body>
<div id="connBanner" class="banner" hidden></div>
<div id="staleBanner" class="banner" hidden></div>
<div id="vBanner" class="banner" hidden></div>
<main id="layout">
  <header id="topTabs" aria-label="top view tabs">
    <span id="viewToggle" role="tablist" aria-label="Switch top view">
      <button id="tabLog" data-view="log" aria-pressed="true" role="tab"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h7"/></svg>Log</button><button id="tabTime" data-view="time" aria-pressed="false" role="tab"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/></svg>Timeline</button>
    </span>
  </header>
  <section id="msgPane" aria-label="top views">
    <div id="msgList"></div>
    <div id="timeList" hidden></div>
  </section>
  <div id="divider"></div>
  <section id="agentPane" aria-label="agents">
    <header id="agentHeader">
      <span class="hleft"><span class="title">Agents</span><span class="count" id="agentCount"></span><select id="wsFilter" aria-label="Filter by workspace group" title="Filter by workspace group"><option value="all">All</option></select></span><span class="hsetwrap"><button id="agentSettings" aria-label="Agent list settings" aria-haspopup="true" aria-expanded="false" title="Agent list settings"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.9M8 12.3v1.9M1.8 8h1.9M12.3 8h1.9M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M12.4 3.6l-1.3 1.3M4.9 11.1l-1.3 1.3"/></svg></button><div id="agentSettingsPop" hidden aria-label="Agent list settings"><button id="sortToggle" class="hbtn" aria-pressed="true" title="Toggle activity sort">Sort</button><button id="compactToggle" class="hbtn" aria-pressed="false" title="Toggle compact view">Compact</button><button id="clearPins" class="hbtn" hidden title="Clear all pins">Clear pins</button></div></span>
    </header>
    <div id="agentList"></div>
  </section>
</main>
<div id="histModal" hidden>
  <div id="histDlg" role="dialog" aria-modal="true" aria-label="Full history">
    <div class="mhead"><span id="histTitle"></span><button id="histClose" aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div id="histBody"></div>
  </div>
</div>
<script>
(function () {
  "use strict";

  /* SCHEMA §3-1. 클라이언트 버전과 호환 하한. minClientV는 /version에서 갱신. */
  var CLIENT_V = 1;
  var minClientV = 1;

  /* HISTORY_N: PRD FR-11. N=3 고정, 설정·쿼리로 변경 불가. */
  var HISTORY_N = 3;
  /* UI 배치 #3: 인라인 스타일·매직넘버 금지. 값 변경은 이 상수만 고친다. */
  var HIST_DEFAULT_N = 2;         /* FR-11: 기본 노출 최신 2건 */
  var MODAL_HISTORY_MAX = 20;     /* FR-11 개정: 모달 최대 20건 */
  var AGENT_TALL_MIN_N = 5;       /* FR-15: 5명 이상일 때만 하단 스크롤 */
  var AGENT_TALL_CLASS = "tall";  /* FR-15: #agentList max-height 토글 클래스 */
  var BUFFER_MAX = 200;
  var HEARTBEAT_STALE_MS = 30000;
  /* FR-10: 상단 탭 선택 영속. 기존 하단 토글 키(mushline.view)를 재사용한다.
     값은 상단 탭에 맞게 log/time. 구 값 agents는 log로 이행한다. */
  var VIEW_KEY = "mushline.view";
  /* 워크스페이스 필터 선택 영속. 값은 서버 Agent.workspace 키 또는 all. */
  var WS_KEY = "mushline.ws";
  var WS_ALL = "all";
  /* M3: 활동순 정렬 토글 영속. "0"이면 OFF, 그 외(미설정 포함) ON. */
  var SORT_KEY = "mushline.sort";
  /* M3: 간략 보기 토글 영속. "1"이면 ON, 그 외(미설정 포함) OFF. */
  var COMPACT_KEY = "mushline.compact";
  /* M3: 핀 영속. 이름 문자열 JSON 배열. 깨지면 빈 집합. */
  var PINS_KEY = "mushline.pins";

  var $ = function (id) { return document.getElementById(id); };
  var msgList = $("msgList"), agentList = $("agentList"), timeList = $("timeList");
  var agentCount = $("agentCount");
  var connBanner = $("connBanner"), staleBanner = $("staleBanner"), vBanner = $("vBanner");
  var tabLogBtn = $("tabLog"), tabTimeBtn = $("tabTime");
  var wsFilter = $("wsFilter");
  var sortToggle = $("sortToggle"), compactToggle = $("compactToggle"), clearPins = $("clearPins");
  var agentSettings = $("agentSettings"), agentSettingsPop = $("agentSettingsPop");

  var state = {
    agents: [],
    activities: [],   /* 오래된 순. DOM·이력의 원본 */
    view: "log",
    healthOk: true,
    healthSource: null,
    healthReason: null,
    seenIds: new Set(),
    needClearOnSnapshot: false,
    lastHeartbeatAt: 0,
    everConnected: false,
    openedCount: 0,
    vDropped: 0,
    lastBannerText: null,
    ws: WS_ALL,
    /* 에이전트 이름 → workspace 키. snapshot에서 사라져도 지우지 않는다:
       끝난 에이전트의 로그도 이 세션 동안은 같은 워크스페이스로 분류된다. */
    wsOf: new Map(),
    /* workspace 키 → 마지막으로 본 라벨. */
    wsLabel: new Map(),
    /* M3: 이름별 카드 DOM 노드 재사용표. 전체 재생성 대신 갱신·재배치한다. */
    cardOf: new Map(),
    /* M3: true면 renderAgents가 카드 DOM을 만진다. 메시지 추가만으로는 서지 않는다. */
    agentsDirty: true,
    /* M3: 활동순 정렬 ON이 기본. */
    sortOn: true,
    /* M3: 간략 보기 OFF가 기본. */
    compact: false,
    /* M3: 핀한 이름 집합(프로토타입 오염 방지용 null-prototype). */
    pins: Object.create(null),
    /* M3: pointer/focus 독립 추적. holdOrder = pointerInside || focusInside. */
    pointerInside: false,
    focusInside: false,
    holdOrder: false,
    /* M3: 보류 중에 건너뛴 재정렬이 있으면 해제 시 1회 한다. */
    orderPending: false
  };

  /* M3: storage 읽기는 전부 삼킨다. 파싱 실패·비배열·비문자열 원소는 무시. */
  function loadPins() {
    try {
      var raw = window.localStorage.getItem(PINS_KEY);
      if (!raw) return Object.create(null);
      var v = JSON.parse(raw);
      if (!Array.isArray(v)) return Object.create(null);
      var o = Object.create(null);
      for (var i = 0; i < v.length; i++) if (typeof v[i] === "string") o[v[i]] = true;
      return o;
    } catch (e) { return Object.create(null); }
  }
  function savePins() {
    try { window.localStorage.setItem(PINS_KEY, JSON.stringify(Object.keys(state.pins))); }
    catch (e) { /* 무시 */ }
  }

  try {
    var saved = window.localStorage.getItem(VIEW_KEY);
    if (saved === "log" || saved === "time") state.view = saved;
    else if (saved === "agents") state.view = "log";
    var savedWs = window.localStorage.getItem(WS_KEY);
    if (typeof savedWs === "string" && savedWs !== "") state.ws = savedWs;
    if (window.localStorage.getItem(SORT_KEY) === "0") state.sortOn = false;
    if (window.localStorage.getItem(COMPACT_KEY) === "1") state.compact = true;
    state.pins = loadPins();
  } catch (e) { /* localStorage 불가 환경에서는 기본 뷰·기본 토글·빈 핀 */ }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* SCHEMA §4 소유(W2): 당일은 HH:MM, 전일 이전은 MM-DD HH:MM. 상대시간 금지. */
  function fmtTime(iso) {
    if (iso === null || iso === undefined || iso === "") return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear() &&
      d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (sameDay) return hm;
    return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + hm;
  }

  /* SCHEMA §4 소유(W2): statusContext의 tool: 접두를 떼고
     <label> + 공백 2칸 + <detail>. 한쪽 null이면 나머지만, 둘 다 null이면 (idle). */
  function combineLine(statusContext, statusDetail) {
    var label = statusContext;
    if (typeof label === "string" && label.indexOf("tool:") === 0) {
      label = label.slice(5);
    }
    var parts = [];
    if (label !== null && label !== undefined && label !== "") parts.push(label);
    if (statusDetail !== null && statusDetail !== undefined && statusDetail !== "") parts.push(statusDetail);
    if (parts.length > 0) return parts.join("  ");
    if (statusContext === null && statusDetail === null) return "(idle)";
    return "";
  }

  function esc(text) { return text === null || text === undefined ? "" : String(text); }

  /* UI 배치2-1: 메시지 본문의 연속 공백 줄을 접는다. 공백만 있는 줄의 연속은
     최대 1줄로 줄이고 앞쪽 빈 줄은 버려 빈 줄이 자리를 차지하지 않게 한다.
     헤더·접기/펼치기 버튼은 건드리지 않는다. */
  function foldBlankLines(s) {
    var lines = String(s).split("\n");
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].trim() !== "") { out.push(lines[i]); continue; }
      var prev = out.length > 0 ? out[out.length - 1] : null;
      if (prev !== null && prev.trim() !== "") out.push("");
    }
    return out.join("\n");
  }

  function statusGlyph(status) {
    if (status === "active") return "\u25B6";    /* ▶ */
    if (status === "listening") return "\u25CF"; /* ● */
    if (status === "blocked") return "\u25A0";   /* ■ */
    if (status === "inactive") return "\u25CB";  /* ○ */
    return "?";
  }

  /* UI 배치 #5: tool 약자 매핑. claude→CC, opencode→OC, codex→CX,
     그 외 원문 앞 2자 대문자. null/""이면 뱃지 없음. 모델명은 표시하지 않는다. */
  function toolAbbr(tool) {
    if (tool === null || tool === undefined || tool === "") return null;
    var t = String(tool);
    var low = t.toLowerCase();
    if (low === "claude") return "CC";
    if (low === "opencode") return "OC";
    if (low === "codex") return "CX";
    return t.slice(0, 2).toUpperCase();
  }

  /* --- 배너 --- */

  /* SCHEMA §3-10: ok=false 배너는 ok=true까지 유지. 정상 snapshot이 와도 내리지 않는다. */
  /* SCHEMA §3-11: heartbeat 30초 공백도 stale. */
  function refreshStale() {
    var hbStale = state.lastHeartbeatAt > 0 &&
      (Date.now() - state.lastHeartbeatAt > HEARTBEAT_STALE_MS);
    var stale = !state.healthOk || hbStale;
    var text = null;
    if (!state.healthOk) {
      text = "STALE — " + esc(state.healthSource) + ": " + esc(state.healthReason);
    } else if (hbStale) {
      text = "STALE — no heartbeat for 30s";
    }
    if (text === state.lastBannerText) return;
    state.lastBannerText = text;
    if (text === null) {
      staleBanner.hidden = true;
      staleBanner.textContent = "";
    } else {
      staleBanner.textContent = text;
      staleBanner.hidden = false;
    }
  }

  function setConn(text) {
    if (text === null) {
      connBanner.hidden = true;
      connBanner.textContent = "";
    } else {
      connBanner.textContent = text;
      connBanner.hidden = false;
    }
  }

  /* SCHEMA §3-1: v가 minClientV 미만이거나 모르는 값이면 버리고 경고. 조용히 무시 금지. */
  function checkVersion(ev) {
    if (ev === null || ev === undefined || typeof ev.v !== "number") {
      state.vDropped += 1;
      vBanner.textContent = "Version warning — no v, dropped " + state.vDropped + " events";
      vBanner.hidden = false;
      return false;
    }
    if (ev.v < minClientV) {
      state.vDropped += 1;
      vBanner.textContent = "Version warning — v=" + ev.v + " < minClientV=" + minClientV +
        ", dropped " + state.vDropped + " events";
      vBanner.hidden = false;
      return false;
    }
    return true;
  }

  /* --- 렌더 --- */

  /* --- 워크스페이스 필터 ---
     미분류(workspace를 모르는 에이전트)는 All에서만 보인다. */
  function inWs(name) {
    if (state.ws === WS_ALL) return true;
    return state.wsOf.get(name) === state.ws;
  }
  /* 보낸 쪽·받는 쪽 중 하나라도 선택 워크스페이스면 보인다. 수신자 없는 브로드캐스트는
     전원에게 배달되므로 어느 워크스페이스에서나 보인다. */
  function msgVisible(m) {
    if (state.ws === WS_ALL) return true;
    if (inWs(m.from)) return true;
    if (!m.to || m.to.length === 0) return true;
    for (var i = 0; i < m.to.length; i++) if (inWs(m.to[i])) return true;
    return false;
  }

  function renderWsOptions() {
    var counts = new Map();
    state.agents.forEach(function (a) {
      if (a.workspace === null || a.workspace === undefined || a.workspace === "") return;
      counts.set(a.workspace, (counts.get(a.workspace) || 0) + 1);
    });
    var keys = Array.from(counts.keys());
    /* 선택한 워크스페이스에 지금 에이전트가 없어도 선택은 유지한다(재기동 대기). */
    if (state.ws !== WS_ALL && keys.indexOf(state.ws) < 0) keys.push(state.ws);
    keys.sort(function (x, y) {
      var lx = state.wsLabel.get(x) || x, ly = state.wsLabel.get(y) || y;
      return lx < ly ? -1 : (lx > ly ? 1 : 0);
    });
    /* M3-ui3: 옵션 라벨에 카운트를 붙이지 않는다("All", "label" 그대로).
       카운트 변화만으로는 다시 그리지 않는다. */
    var sig = state.ws + "|" + keys.map(function (k) {
      return k + "=" + (state.wsLabel.get(k) || "");
    }).join("|");
    if (wsFilter.getAttribute("data-sig") === sig) return;
    wsFilter.setAttribute("data-sig", sig);
    wsFilter.textContent = "";
    var all = document.createElement("option");
    all.value = WS_ALL;
    all.textContent = "All";
    wsFilter.appendChild(all);
    keys.forEach(function (k) {
      var o = document.createElement("option");
      o.value = k;
      var label = state.wsLabel.get(k) || (k.indexOf("dir:") === 0 ? k.slice(4) : k);
      o.textContent = label;
      o.title = label;
      wsFilter.appendChild(o);
    });
    wsFilter.value = state.ws;
    /* M3-ui3 추가요구2: fluid로 잘린 선택값의 전체 라벨은 select title로
       보여준다(option title은 드롭다운 쪽). */
    wsFilter.title = state.ws === WS_ALL ? "All"
      : (state.wsLabel.get(state.ws) || (state.ws.indexOf("dir:") === 0 ? state.ws.slice(4) : state.ws));
  }

  function applyMsgFilter() {
    var kids = msgList.children;
    for (var i = 0; i < kids.length; i++) {
      var m = kids[i]._msg;
      if (!m) continue;
      var hide = !msgVisible(m);
      if (kids[i].hidden !== hide) {
        kids[i].hidden = hide;
        if (!hide && !kids[i]._measured) pendingMeasure.push(kids[i]);
      }
    }
  }

  function setWs(k) {
    state.ws = (typeof k === "string" && k !== "") ? k : WS_ALL;
    try { window.localStorage.setItem(WS_KEY, state.ws); } catch (e) { /* 무시 */ }
    renderWsOptions();
    applyMsgFilter();
    applyView();
    renderAgents(true);
    renderTimeOnce();
    flushMeasure();
    if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
  }
  wsFilter.addEventListener("change", function () { setWs(wsFilter.value); });

  /* M3 활동순: blocked → pinned → active → listening → unknown → inactive,
     동률은 lastEventAt 내림차순(null은 뒤), 다음 name 오름차순. */
  function agentRank(a) {
    if (a.status === "blocked") return 0;
    if (state.pins[a.name]) return 1;
    if (a.status === "active") return 2;
    if (a.status === "listening") return 3;
    if (a.status === "unknown") return 4;
    return 5;
  }
  /* 내림차순 비교. null·undefined·""은 뒤. 같으면 0. */
  function cmpLastEventDesc(x, y) {
    var nx = (x === null || x === undefined || x === "");
    var ny = (y === null || y === undefined || y === "");
    if (nx && ny) return 0;
    if (nx) return 1;
    if (ny) return -1;
    return x < y ? 1 : (x > y ? -1 : 0);
  }

  function sortedAgents() {
    var vis = [];
    state.agents.forEach(function (a) {
      if (inWs(a.name)) vis.push(a);
    });
    /* 정렬 OFF = 기존 동작(blocked 먼저, 나머지 서버 순서).
       pinned은 OFF에서도 blocked 다음. */
    if (!state.sortOn) {
      var blocked = [], pinned = [], rest = [];
      vis.forEach(function (a) {
        if (a.status === "blocked") blocked.push(a);
        else if (state.pins[a.name]) pinned.push(a);
        else rest.push(a);
      });
      return blocked.concat(pinned, rest);
    }
    vis.sort(function (a, b) {
      var r = agentRank(a) - agentRank(b);
      if (r !== 0) return r;
      var t = cmpLastEventDesc(a.lastEventAt, b.lastEventAt);
      if (t !== 0) return t;
      return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
    });
    return vis;
  }

  function historyFor(name) {
    var out = [];
    for (var i = state.activities.length - 1; i >= 0; i--) {
      if (state.activities[i].agent === name) {
        out.push(state.activities[i]);
        if (out.length >= HISTORY_N) break;
      }
    }
    return out;
  }

  function activityLine(a) {
    return combineLine("tool:" + a.label, a.detail);
  }

  /* M3: 이름별 노드 재사용. 새 이름만 만들고, 있는 건 내용만 갱신한다.
     explicit=true(핀·필터·정렬 토글 같은 명시 조작)는 보류 중에도 즉시 재정렬.
     자동 렌더는 보류 중이면 내용 갱신·신규/삭제만 하고 순서는 둔다. */
  function renderAgents(explicit) {
    var list = sortedAgents();
    /* M3-ui2: 카운트는 타이틀 옆 "(N)" / "(보이는 수/N)". 숫자는 기존과 동일
       (전체 = state.agents.length, 필터 시 보이는 수/전체). */
    agentCount.textContent = "(" + (state.ws === WS_ALL ? "" : list.length + "/") +
      state.agents.length + ")";
    updateClearPins();
    if (!explicit && !state.agentsDirty && !state.orderPending) return;
    /* M3 rework B: hold 중 메시지 전용 렌더는 카드 렌더를 건너뛰고 orderPending만 유지. */
    if (!explicit && !state.agentsDirty && state.holdOrder) return;
    var reorder = explicit || !state.holdOrder;
    var seen = Object.create(null);
    var i, a, el;
    for (i = 0; i < list.length; i++) {
      a = list[i];
      seen[a.name] = true;
      el = state.cardOf.get(a.name);
      if (!el) {
        el = buildAgentCard(a);
        state.cardOf.set(a.name, el);
      } else {
        updateAgentCard(el, a);
      }
      if (!el.parentNode) agentList.appendChild(el);
    }
    state.cardOf.forEach(function (node, nm) {
      if (!seen[nm]) {
        if (node.parentNode === agentList) agentList.removeChild(node);
        state.cardOf.delete(nm);
      }
    });
    if (reorder) {
      for (i = 0; i < list.length; i++) {
        el = state.cardOf.get(list[i].name);
        if (el) agentList.appendChild(el);
      }
      state.orderPending = false;
    } else {
      state.orderPending = true;
    }
    /* FR-15: 5명 이상일 때만 하단 스크롤. 4명 이하에서는 max-height를 두지 않아
       O-2①(무스크롤)을 구조적으로 보장한다. UI 배치 #3: 인라인 스타일 대신
       tall 클래스 + 상수로만 토글한다. */
    if (list.length >= AGENT_TALL_MIN_N) {
      agentList.classList.add(AGENT_TALL_CLASS);
    } else {
      agentList.classList.remove(AGENT_TALL_CLASS);
    }
    state.agentsDirty = false;
  }

  function displayNameOf(a) {
    var base = (a.tag !== null && a.tag !== undefined && a.tag !== "")
      ? a.tag + "/" + a.name : esc(a.name);
    return base + (a.unreadCount > 0 ? " (" + a.unreadCount + ")" : "");
  }

  /* M3-ui2: 핀 아이콘은 별(★/☆)이 아니라 압정 SVG. innerHTML에는 아래 정적
     문자열만 넣는다(이름 포함 금지). 고정 = 채움, 해제 = 외곽선. */
  var PIN_SVG_ON = '<svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="3.5"/><path d="M8 9v5" fill="none"/></svg>';
  var PIN_SVG_OFF = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="3.5"/><path d="M8 9v5"/></svg>';
  function refreshPinBtn(btn, name) {
    var on = !!state.pins[name];
    btn.textContent = "";
    btn.innerHTML = on ? PIN_SVG_ON : PIN_SVG_OFF;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.title = on ? name + " unpin" : name + " pin";
  }

  function buildAgentCard(a) {
    var wrap = document.createElement("div");
    wrap.className = "agent" + (a.status === "blocked" ? " blocked" : "");
    wrap.setAttribute("data-agent", a.name);

    var head = document.createElement("div");
    head.className = "head";
    var who = document.createElement("span");
    who.className = "who";
    var glyph = document.createElement("span");
    glyph.className = "sglyph sg-" + esc(a.status);
    glyph.textContent = statusGlyph(a.status);
    who.appendChild(glyph);
    var aname = document.createElement("span");
    aname.className = "aname";
    aname.textContent = displayNameOf(a);
    who.appendChild(aname);
    head.appendChild(who);
    var hact = document.createElement("span");
    hact.className = "hact";
    var st = document.createElement("span");
    st.className = "st st-" + esc(a.status);
    st.textContent = esc(a.status);
    hact.appendChild(st);
    (function (nm) {
      var pin = document.createElement("button");
      pin.className = "pinbtn";
      pin.setAttribute("aria-label", nm + " pin");
      pin.addEventListener("click", function () { togglePin(nm); });

  function syncToolBadge(wrap, a) {
    var abbr = toolAbbr(a.tool);

    var descText = esc(a.description).trim();

  /* 이력 영역. 바뀐 에이전트만 다시 만든다. N 상한은 HISTORY_N이 건다. */
  function syncHwrap(wrap, a) {

  function updateAgentCard(el, a) {

    el._glyph.className = "sglyph sg-" + esc(a.status);
    el._glyph.textContent = statusGlyph(a.status);

  function renderTime() {
    timeList.textContent = "";
    var acts = state.activities.filter(function (a) { return inWs(a.agent); }).sort(function (x, y) {
      return (x.ts < y.ts ? 1 : (x.ts > y.ts ? -1 : 0));
    });
    acts.forEach(function (a) {
      var row = document.createElement("span");
      row.className = "trow";
      var kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = esc(a.kind);
      row.appendChild(kind);
      var tt = document.createElement("span");
      tt.className = "tt";
      tt.textContent = fmtTime(a.ts) + " " + a.agent + " ";
      row.appendChild(tt);

      row.title = fmtTime(a.ts) + " " + a.agent + " " + activityLine(a);

  }

     timeList 렌더는 시간순 뷰일 때 renderTimeOnce가 따로 맡아

  function applyView() {

  function modalHistories(name) {

    }
    return out.slice(0, MODAL_HISTORY_MAX);

  /* FR-11 모달: N 상한은 MODAL_HISTORY_MAX가 건다. */
  var histModal = $("histModal"), histTitle = $("histTitle"),

  function setView(v) {

  /* --- M3: 핀·정렬·간략 보기 --- */

  /* 핀 토글 시 msgList 전체(hidden 행 포함)의 [data-who]를 순회해 클래스만

    }
  }

  /* Clear pins는 핀이 1개 이상일 때만 노출. */
  function updateClearPins() {
    var n = Object.keys(state.pins).length;
    clearPins.hidden = n === 0;
  }

  function refreshAllPinBtns() {
    state.cardOf.forEach(function (node, nm) {
      if (node._pin) refreshPinBtn(node._pin, nm);
    });
    updateClearPins();
  }

  function togglePin(name) {
    if (state.pins[name]) delete state.pins[name];
    else state.pins[name] = true;
    savePins();
    refreshAllPinBtns();
    retogglePinned();
    /* 명시 조작은 보류 중에도 즉시 재정렬. */
    renderAgents(true);
    if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
  }

  clearPins.addEventListener("click", function () {
    state.pins = Object.create(null);
    savePins();
    refreshAllPinBtns();
    retogglePinned();

  });

  function setSort(on) {

    sortToggle.setAttribute("aria-pressed", on ? "true" : "false");

  }
  sortToggle.addEventListener("click", function () { setSort(!state.sortOn); });

  /* M3-ui3: 헤더 설정 버블. 버블 안 토글을 눌러도 버블은 열린 채 유지한다.

     버블은 #agentHeader 안에 있어 #agentList hold(pointer/focus) 판정에 닿지 않는다. */
  function isSettingsOpen() { return !agentSettingsPop.hidden; }

  document.addEventListener("click", function (ev) {

    if (t && (agentSettings.contains(t) || agentSettingsPop.contains(t))) return;
    setSettingsOpen(false);
  });

  /* 자동 재정렬만 보류. 핀·필터·정렬 토글 같은 명시 조작은 renderAgents(true)로
     즉시 간다. 보류 해제 시 최신 state로 1회 재정렬. */
  function releaseHold() {
    if (state.orderPending) {
      state.orderPending = false;
      renderAgents(true);
    }
  }
  /* M3 rework A: pointer/focus 독립 추적. holdOrder = pointerInside || focusInside.
     둘 다 false일 때만 releaseHold. */
  function syncHold() {
    state.holdOrder = !!(state.pointerInside || state.focusInside);
    if (!state.holdOrder) releaseHold();
  }
  agentList.addEventListener("mouseenter", function () {
    state.pointerInside = true;
    state.holdOrder = true;
  });
  agentList.addEventListener("mouseleave", function () {
    state.pointerInside = false;
    syncHold();
  });
  agentList.addEventListener("focusin", function () {
    state.focusInside = true;
    state.holdOrder = true;
  });
  agentList.addEventListener("focusout", function (ev) {
    var to = ev.relatedTarget;
    if (to && agentList.contains(to)) return;
    state.focusInside = false;
    syncHold();
  });

  /* 메시지: 최신이 아래, 자동 스크롤(맨 아래 근처일 때만 따라감). */
  var msgPane = $("msgPane");
  var stickToBottom = true;
  msgPane.addEventListener("scroll", function () {
    stickToBottom = (msgPane.scrollHeight - msgPane.scrollTop - msgPane.clientHeight) < 24;
  });

  /* M3: 발신인·각 수신인을 개별 span(dataset.who)으로 만든다.
     이름은 createElement + textContent로만 넣는다. esc()는 HTML 이스케이프가
     아니라서 innerHTML에 이름을 넣으면 P6(XSS)이 뚫린다.
     `@`·쉼표·화살표는 별도 텍스트 노드. 신규 메시지는 append 시점 핀을 바로 입힌다. */
  function whoSpan(name) {
    var s = document.createElement("span");
    s.setAttribute("data-who", name);
    s.textContent = name;
    if (state.pins[name]) s.classList.add("pinned");
    return s;
  }

  function appendMessage(m) {
    var wrap = document.createElement("div");
    wrap.className = "msg";
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.appendChild(document.createTextNode("● "));
    meta.appendChild(whoSpan(m.from));
    meta.appendChild(document.createTextNode(" → "));
    if (m.to && m.to.length) {
      for (var ti = 0; ti < m.to.length; ti++) {
        if (ti > 0) meta.appendChild(document.createTextNode(","));
        meta.appendChild(document.createTextNode("@"));
        meta.appendChild(whoSpan(m.to[ti]));
      }
    } else {
      meta.appendChild(document.createTextNode("(all)"));
    }
    meta.appendChild(document.createTextNode("  "));
    if (m.intent) {
      var chip = document.createElement("span");
      chip.className = "intent";
      chip.textContent = m.intent;
      meta.appendChild(chip);
    }
    var ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = "  " + fmtTime(m.ts);
    meta.appendChild(ts);
    var exp = document.createElement("span");
    exp.className = "exp";
    exp.setAttribute("aria-hidden", "true");
    exp.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
    meta.appendChild(exp);
    var text = document.createElement("div");
    text.className = "text";
    text.textContent = foldBlankLines(esc(m.text));
    text.title = esc(m.text);
    wrap.appendChild(meta);
    wrap.appendChild(text);
    wrap._msg = { from: m.from, to: m.to };
    wrap.hidden = !msgVisible(m);
    msgList.appendChild(wrap);
    while (msgList.children.length > BUFFER_MAX) {
      msgList.removeChild(msgList.firstChild);
    }
    /* 말줄임 판정(scrollHeight 읽기)은 강제 레이아웃이라 메시지마다 하지 않고
       다음 프레임에 모아서 한다. 숨은 메시지는 높이가 0이라 보일 때 판정한다. */
    if (!wrap.hidden) pendingMeasure.push(wrap);
    scheduleRender();
  }

  var pendingMeasure = [];
  function flushMeasure() {
    /* M3: msgList가 hidden(Timeline 탭)일 때는 측정하지 않고 큐에 남긴다.
       Log 탭 복귀(setView) 시 측정한다. */
    if (msgList.hidden) return;
    if (pendingMeasure.length === 0) return;
    var batch = pendingMeasure;
    pendingMeasure = [];
    /* 읽기를 모두 끝낸 뒤 쓴다(레이아웃 스래싱 방지). */
    var over = batch.map(function (w) {
      if (w.hidden || w._measured || !w.parentNode) return false;
      var t = w.lastChild;
      return t.scrollHeight > t.clientHeight + 1;
    });
    batch.forEach(function (w, i) {
      if (w.hidden || w._measured || !w.parentNode) return;
      w._measured = true;
      if (over[i]) markClamped(w);
    });
  }

  /* 펼칠 내용이 있을 때만 role·핸들러를 건다. */
  function markClamped(wrap) {
    var meta = wrap.firstChild;
    wrap.classList.add("clamped");
    meta.setAttribute("role", "button");
    meta.setAttribute("tabindex", "0");

    });

    });
  }

  /* 렌더 병합: 이벤트마다 전체를 다시 그리지 않고 한 프레임에 한 번만 그린다.
     접속 직후 backlog 200건이 한꺼번에 들어올 때 전체 재렌더 200회가 1회가 된다. */
  var renderPending = false;
  function scheduleRender() {
    if (renderPending) return;
    renderPending = true;
    window.requestAnimationFrame(flushRender);
  }
  function flushRender() {
    renderPending = false;
    applyView();
    renderTimeOnce();
    flushMeasure();
    if (stickToBottom) msgPane.scrollTop = msgPane.scrollHeight;
    refreshStale();
  }

  /* --- 이벤트 처리 --- */

  function onSnapshot(ev) {
    if (!checkVersion(ev)) return;
    /* SCHEMA §3-4: 재연결 후 첫 snapshot에 중복 배제 윈도 파기. */
    if (state.needClearOnSnapshot) {
      state.seenIds.clear();
      state.needClearOnSnapshot = false;
    }
    /* SCHEMA §3-5: agents는 전량. 없는 에이전트는 사라진 것으로 교체한다. */
    state.agents = Array.isArray(ev.agents) ? ev.agents : [];
    state.agents.forEach(function (a) {
      if (a.workspace === null || a.workspace === undefined || a.workspace === "") return;
      state.wsOf.set(a.name, a.workspace);
      if (a.workspaceLabel) state.wsLabel.set(a.workspace, a.workspaceLabel);
    });
    /* M3: snapshot에서 사라진 이름의 핀도 지운다. */
    (function () {
      var aliveNow = Object.create(null);
      state.agents.forEach(function (a) { aliveNow[a.name] = true; });
      var pruned = false, nm;
      for (nm in state.pins) {
        if (Object.prototype.hasOwnProperty.call(state.pins, nm) && !aliveNow[nm]) {
          delete state.pins[nm];
          pruned = true;
        }
      }
      if (pruned) {
        savePins();
        retogglePinned();
      }
    })();
    state.agentsDirty = true;
    renderWsOptions();
    applyMsgFilter();
    scheduleRender();
  }

  function onActivity(ev) {
    if (!checkVersion(ev)) return;
    if (ev.id !== null && ev.id !== undefined) {
      if (state.seenIds.has(ev.id)) return;
      state.seenIds.add(ev.id);
      if (state.seenIds.size > 1000) {
        var first = state.seenIds.values().next().value;
        state.seenIds.delete(first);
      }
    }
    state.activities.push({
      id: ev.id, ts: ev.ts, agent: ev.agent,
      kind: ev.kind, label: ev.label, detail: ev.detail
    });
    while (state.activities.length > BUFFER_MAX) state.activities.shift();
    /* M3: 이력은 카드 이력 영역에 보이므로 카드도 더티. 메시지만 올 때는 서지 않는다. */
    state.agentsDirty = true;
    scheduleRender();
  }

  function onMessage(ev) {
    if (!checkVersion(ev)) return;
    if (ev.id !== null && ev.id !== undefined) {
      if (state.seenIds.has(ev.id)) return;
      state.seenIds.add(ev.id);
    }
    appendMessage(ev);
    refreshStale();
  }

  function onHealth(ev) {
    if (!checkVersion(ev)) return;
    state.healthOk = ev.ok === true;
    state.healthSource = ev.source !== undefined ? ev.source : null;
    state.healthReason = ev.reason !== undefined ? ev.reason : null;
    refreshStale();
  }

  function onHeartbeat(ev) {
    if (!checkVersion(ev)) return;
    state.lastHeartbeatAt = Date.now();
    refreshStale();
  }

  /* --- heartbeat 감시 (SCHEMA §3-11) ---
     setInterval 금지. paint(rAF)·visibilitychange 시점의 Date.now() 차분으로만 감시한다. */
  function tick() {
    refreshStale();
    window.requestAnimationFrame(tick);
  }
  document.addEventListener("visibilitychange", function () {
    refreshStale();
  });

  /* --- 기동 --- */

  function boot() {
    var params = new URLSearchParams(window.location.search);
    var fixturePath = params.get("fixture");
    var forceSample = params.get("sample") === "1";

    /* M3: 저장된 토글 상태를 헤더·본문에 반영. */
    sortToggle.setAttribute("aria-pressed", state.sortOn ? "true" : "false");
    compactToggle.setAttribute("aria-pressed", state.compact ? "true" : "false");
    if (state.compact) document.body.classList.add("compact");

    fetch("/version")
      .then(function (res) { return res.json(); })
      .then(function (v) {
        if (v && typeof v.minClientV === "number") minClientV = v.minClientV;
      })
      .catch(function () { /* 버전 조회 실패는 오프라인 폴백에서 처리 */ })
      .then(function () {
        if (forceSample) {
          loadSample("Sample mode (?sample=1)");
          return;
        }
        if (fixturePath) {
          loadFixture(fixturePath);
          return;
        }
        if (typeof window.EventSource === "undefined") {
          loadSample("No EventSource — showing sample");
          return;
        }
        connect();
      });

    window.requestAnimationFrame(tick);
    applyView();
  }

  function connect() {
    var es;
    try {
      es = new window.EventSource("/events");
    } catch (e) {
      loadSample("Connection failed — showing sample");
      return;
    }
    var gotSnapshot = false;
    var failTimer = null;

    es.onopen = function () {
      state.openedCount += 1;
      /* 재연결이면 다음 snapshot이 중복 윈도 파기의 신호다 (§3-4). */
      if (state.openedCount > 1) state.needClearOnSnapshot = true;
      state.lastHeartbeatAt = Date.now();
      state.everConnected = true;
      setConn(null);
      refreshStale();
    };
    es.addEventListener("snapshot", function (e) {
      gotSnapshot = true;
      try { onSnapshot(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("activity", function (e) {
      try { onActivity(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("message", function (e) {
      try { onMessage(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("health", function (e) {
      try { onHealth(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.addEventListener("heartbeat", function (e) {
      try { onHeartbeat(JSON.parse(e.data)); }
      catch (err) { /* 파싱 실패는 버린다 */ }
    });
    es.onerror = function () {
      /* EventSource는 자동 재시도한다. 첫 snapshot 전 실패면 예시로 기립한다
         (SCHEMA §5: 실서버 없이 화면이 떠야 한다). */
      if (!gotSnapshot && !state.everConnected) {
        loadSample("No server — showing sample (OFFLINE)");
      } else {
        setConn("Disconnected — reconnecting…");
      }
    };
    /* failTimer를 쓰지 않는다: setTimeout도 백그라운드 스로틀 대상이며,
       예시 폴백은 onerror 경로 하나로만 처리한다. */
    void failTimer;
  }

  /* SCHEMA §1 예시 페이로드 기반 내장 샘플.
     실서버 없이 화면이 서는 것이 W1·W2 동시 진행의 전제다 (§5). */
  function sampleEvents() {
    var now = new Date();
    var iso = now.toISOString();
    var old = new Date(now.getTime() - 26 * 3600 * 1000).toISOString();
    return {
      snapshot: {
        v: 1, ts: iso,
        agents: [
          { name: "lune", tag: "w1", status: "active", statusContext: "tool:Bash",
            statusDetail: "bun run src/server.ts", description: "Server/SSE",
            directory: "/Users/x/mushline", unreadCount: 0, lastEventAt: iso },
          { name: "nova", tag: null, status: "blocked", statusContext: "approval",
            statusDetail: "Bash", description: "Frontend rendering",
            directory: "/Users/x/mushline", unreadCount: 0, lastEventAt: iso },
          { name: "sona", tag: null, status: "listening", statusContext: null,
            statusDetail: null, description: "Docs",
            directory: "/Users/x/mushline", unreadCount: 0, lastEventAt: old }
        ]
      },
      activities: [
        { v: 1, id: "sample-1", ts: iso, agent: "lune",
          kind: "tool", label: "Edit", detail: "src/server.ts" },
        { v: 1, id: "sample-2", ts: iso, agent: "nova",
          kind: "cmd", label: "Bash", detail: "bun test --watch" }
      ],
      messages: [
        { v: 1, id: "sample-m1", ts: iso, from: "lune", to: ["nova"],
          intent: "request", thread: null, text: "Boundary schema v1 pushed" },
        { v: 1, id: "sample-m2", ts: iso, from: "nova", to: ["lune"],
          intent: "ack", thread: null, text: "Got it. Wiring up render" }
      ]
    };
  }

  function loadSample(label) {
    var s = sampleEvents();
    setConn(label);
    onSnapshot(s.snapshot);
    s.activities.forEach(onActivity);
    s.messages.forEach(onMessage);
  }

  /* W1의 fixtures/oracle-set.json 갈아끼우기 경로. 형태가 다르면 경고를 낸다. */
  function loadFixture(path) {
    fetch(path)
      .then(function (res) { return res.json(); })
      .then(function (f) {
        setConn("fixture: " + path);
        var snap = f.snapshot || f;
        if (snap && Array.isArray(snap.agents)) onSnapshot(snap);
        var acts = f.activities || f.activity || [];
        acts.forEach(onActivity);
        var msgs = f.messages || f.message || [];
        msgs.forEach(onMessage);
      })
      .catch(function () {
        loadSample("Fixture failed — showing sample (OFFLINE)");
      });
  }

  boot();
})();
</script>
</body>
</html>
